    // --- CANVAS ANIMATED SIMULATION ENGINE ---
    function EnergyCanvasVisualizer({ activeEnergy, isPlaying }) {
      const canvasRef = useRef(null);
      const animFrameRef = useRef(null);
      const tickRef = useRef(0);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let width = 0;
        let height = 0;

        // 每一幀都檢查畫布實際顯示大小（避免版面尚未完成時量到錯誤尺寸，造成一開始畫面被放大）
        const fit = () => {
          const dpr = window.devicePixelRatio || 1;
          const cw = canvas.clientWidth;
          const ch = canvas.clientHeight;
          if (!cw || !ch) return false;
          if (cw !== width || ch !== height || canvas.width !== Math.round(cw * dpr)) {
            width = cw;
            height = ch;
            canvas.width = Math.round(cw * dpr);
            canvas.height = Math.round(ch * dpr);
          }
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          return true;
        };

        const render = () => {
          if (fit()) {
            if (isPlaying) {
              tickRef.current += 1;
            }
            const t = tickRef.current;

            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, width, height);
            ctx.textAlign = 'left';
            ctx.textBaseline = 'alphabetic';

            switch (activeEnergy.id) {
              case 'coal':
              case 'petroleum':
              case 'naturalGas':
                renderFossilPlant(ctx, width, height, t, activeEnergy.id);
                break;
              case 'nuclear':
                renderNuclearPlant(ctx, width, height, t);
                break;
              case 'solar':
                renderSolarPanel(ctx, width, height, t);
                break;
              case 'wind':
                renderWindTurbine(ctx, width, height, t);
                break;
              case 'ocean':
                renderOceanWave(ctx, width, height, t);
                break;
              case 'geothermal':
                renderGeothermalPlant(ctx, width, height, t);
                break;
              case 'hydro':
                renderHydroDam(ctx, width, height, t);
                break;
              case 'biomass':
                renderBiomassDigester(ctx, width, height, t);
                break;
              default:
                break;
            }
          }
          animFrameRef.current = requestAnimationFrame(render);
        };

        render();

        return () => {
          if (animFrameRef.current) cancelAnimationFrame(animFrameRef.current);
        };
      }, [activeEnergy, isPlaying]);

      // --- HELPER RENDERERS FOR CANVAS ANIMATIONS ---
      const TAU = Math.PI * 2;

      const drawLabel = (ctx, text, x, y, size, color, align) => {
        ctx.fillStyle = color;
        ctx.font = `bold ${size}px "Noto Sans TC"`;
        ctx.textAlign = align || 'left';
        ctx.fillText(text, x, y);
        ctx.textAlign = 'left';
      };

      // 導線 + 流動電子 + 「電能」圓形標示
      const drawWireAndBulb = (ctx, x1, y1, bx, by, t) => {
        const endY = by > y1 ? by - 24 : by + 24;
        ctx.strokeStyle = isPlaying ? '#f59e0b' : '#64748b';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(bx, y1);
        ctx.lineTo(bx, endY);
        ctx.stroke();

        if (isPlaying) {
          const L1 = Math.abs(bx - x1);
          const L2 = Math.abs(endY - y1);
          const L = L1 + L2;
          if (L > 0) {
            ctx.fillStyle = '#fef3c7';
            for (let i = 0; i < 6; i++) {
              const d = (t * 2.5 + (i * L) / 6) % L;
              let px, py;
              if (d < L1) {
                px = x1 + Math.sign(bx - x1) * d;
                py = y1;
              } else {
                px = bx;
                py = y1 + Math.sign(endY - y1) * (d - L1);
              }
              ctx.beginPath();
              ctx.arc(px, py, 3.5, 0, TAU);
              ctx.fill();
            }
          }
        }

        if (isPlaying) {
          ctx.fillStyle = 'rgba(251, 191, 36, 0.35)';
          ctx.beginPath();
          ctx.arc(bx, by, 38, 0, TAU);
          ctx.fill();
        }
        ctx.fillStyle = isPlaying ? '#fbbf24' : '#475569';
        ctx.beginPath();
        ctx.arc(bx, by, 24, 0, TAU);
        ctx.fill();
        drawLabel(ctx, '電能', bx, by + 5, 14, isPlaying ? '#451a03' : '#ffffff', 'center');
      };

      // 轉軸 + 發電機方塊 + 導線連到「電能」
      const drawGeneratorBulb = (ctx, w, h, sx, cy, t, genLabel, bulbX, bulbY) => {
        const gw = genLabel.length * 16 + 18;
        const gh = 44;
        const gx = sx + 24;

        ctx.strokeStyle = '#e2e8f0';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(sx, cy);
        ctx.lineTo(gx, cy);
        ctx.stroke();

        ctx.fillStyle = '#059669';
        ctx.fillRect(gx, cy - gh / 2, gw, gh);
        ctx.strokeStyle = '#34d399';
        ctx.lineWidth = 2;
        ctx.strokeRect(gx, cy - gh / 2, gw, gh);
        drawLabel(ctx, genLabel, gx + gw / 2, cy + 5, 15, '#ffffff', 'center');

        const bx = Math.min(w - 40, Math.max(bulbX, gx + gw + 40));
        drawWireAndBulb(ctx, gx + gw, cy, bx, bulbY, t);
      };

      // 汽輪機（三條葉片線＝六片扇葉）
      const drawTurbine = (ctx, tx, ty, t, label) => {
        ctx.save();
        ctx.translate(tx, ty);
        ctx.rotate(isPlaying ? t * 0.15 : 0);
        ctx.fillStyle = '#38bdf8';
        for (let i = 0; i < 3; i++) {
          ctx.rotate(Math.PI / 3);
          ctx.fillRect(-4, -24, 8, 48);
        }
        ctx.restore();

        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(tx, ty, 28, 0, TAU);
        ctx.stroke();
        drawLabel(ctx, label, tx, ty + 50, 15, '#cbd5e1', 'center');
      };

      // 渦輪機 + 發電機 + 電能（核能、地熱、生質能共用）
      const drawTurbineAndBulb = (ctx, w, h, tx, ty, t, turbLabel, genLabel, bulbX, bulbY) => {
        drawTurbine(ctx, tx, ty, t, turbLabel);
        drawGeneratorBulb(ctx, w, h, tx + 28, ty, t, genLabel, bulbX, bulbY);
      };

      // 1. Thermal Fossil Fuel (Coal, Petroleum, Natural Gas)
      const renderFossilPlant = (ctx, w, h, t, type) => {
        if (type === 'naturalGas') {
          drawLabel(ctx, '【氣體比重】天然氣(甲烷) ⬆️ 輕浮飄散  |  桶裝瓦斯(丙烷/丁烷) ⬇️ 重沉地面', w * 0.04, h * 0.16, 15, '#38bdf8');
          if (isPlaying) {
            ctx.fillStyle = '#38bdf8';
            for (let i = 0; i < 3; i++) {
              const y = h * 0.75 - ((t * 2 + i * 25) % (h * 0.5));
              const x = w * 0.08 + i * 14;
              ctx.beginPath();
              ctx.arc(x, y, 6, 0, TAU);
              ctx.fill();
            }
            ctx.fillStyle = '#f97316';
            for (let i = 0; i < 3; i++) {
              const y = h * 0.45 + ((t * 2 + i * 25) % (h * 0.35));
              const x = w * 0.32 + i * 14;
              ctx.beginPath();
              ctx.arc(x, y, 6, 0, TAU);
              ctx.fill();
            }
          }
        }

        // Boiler
        ctx.fillStyle = '#334155';
        ctx.fillRect(w * 0.1, h * 0.45, w * 0.22, h * 0.45);
        ctx.strokeStyle = '#64748b';
        ctx.lineWidth = 3;
        ctx.strokeRect(w * 0.1, h * 0.45, w * 0.22, h * 0.45);
        drawLabel(ctx, type === 'coal' ? '燃煤鍋爐' : type === 'petroleum' ? '燃油鍋爐' : '燃氣渦輪機', w * 0.11, h * 0.53, 16, '#f8fafc');

        // Flames
        if (isPlaying) {
          for (let i = 0; i < 5; i++) {
            const flameH = 20 + Math.sin(t * 0.2 + i) * 12;
            ctx.fillStyle = i % 2 === 0 ? '#ef4444' : '#f59e0b';
            ctx.beginPath();
            ctx.arc(w * 0.15 + i * 14, h * 0.8 - flameH / 2, 10 + Math.sin(t * 0.1) * 3, 0, TAU);
            ctx.fill();
          }
        }

        // Steam pipe
        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.moveTo(w * 0.21, h * 0.45);
        ctx.lineTo(w * 0.21, h * 0.3);
        ctx.lineTo(w * 0.55, h * 0.3);
        ctx.stroke();

        if (isPlaying) {
          ctx.fillStyle = '#ffffff';
          for (let i = 0; i < 6; i++) {
            const px = w * 0.21 + ((t * 2 + i * 40) % (w * 0.34));
            ctx.beginPath();
            ctx.arc(px, h * 0.3, 4, 0, TAU);
            ctx.fill();
          }
        }

        // Turbine → Generator → 電能
        const turbineX = w * 0.58;
        const turbineY = h * 0.3;
        drawTurbine(ctx, turbineX, turbineY, t, '汽輪機');
        drawGeneratorBulb(ctx, w, h, turbineX + 28, turbineY, t, '發電機', w * 0.9, h * 0.72);
      };

      // 2. Nuclear Plant
      const renderNuclearPlant = (ctx, w, h, t) => {
        drawLabel(ctx, '⚛️ 核反應爐內部 (核分裂連鎖反應)', w * 0.08, h * 0.18, 17, '#38bdf8');

        const cx = w * 0.32;
        const cy = h * 0.52;
        ctx.strokeStyle = '#10b981';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(cx, cy, 70, 0, TAU);
        ctx.stroke();

        const splitOffset = isPlaying ? Math.abs(Math.sin(t * 0.1)) * 26 : 0;
        ctx.fillStyle = '#f59e0b';
        ctx.beginPath();
        ctx.arc(cx - splitOffset, cy, 20, 0, TAU);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(cx + splitOffset, cy, 20, 0, TAU);
        ctx.fill();
        drawLabel(ctx, '鈾-235', cx - splitOffset, cy + 5, 13, '#ffffff', 'center');
        drawLabel(ctx, '鈾-235', cx + splitOffset, cy + 5, 13, '#ffffff', 'center');

        if (isPlaying) {
          const nx = cx - 120 + ((t * 4) % 120);
          ctx.fillStyle = '#38bdf8';
          ctx.beginPath();
          ctx.arc(nx, cy, 7, 0, TAU);
          ctx.fill();

          ctx.strokeStyle = `rgba(239, 68, 68, ${0.4 + Math.sin(t * 0.2) * 0.4})`;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(cx, cy, 45 + (t % 30), 0, TAU);
          ctx.stroke();
        }

        const tx = w * 0.62;
        ctx.strokeStyle = '#cbd5e1';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(cx + 70, cy);
        ctx.lineTo(tx - 28, cy);
        ctx.stroke();
        if (isPlaying) {
          ctx.fillStyle = '#ffffff';
          for (let i = 0; i < 4; i++) {
            const px = cx + 70 + ((t * 2 + i * 40) % (tx - 28 - cx - 70));
            ctx.beginPath();
            ctx.arc(px, cy, 4, 0, TAU);
            ctx.fill();
          }
        }

        drawTurbineAndBulb(ctx, w, h, tx, cy, t, '汽輪機', '發電機', w * 0.9, h * 0.84);
      };

      // 3. Solar：發電 + 植物生長 + 動物取暖
      const renderSolarPanel = (ctx, w, h, t) => {
        const fs = Math.max(12, Math.min(16, w / 55));
        const groundY = h * 0.9;

        // Ground
        ctx.fillStyle = '#14532d';
        ctx.fillRect(0, groundY, w, h - groundY);

        // Sun
        const sunX = w * 0.09;
        const sunY = h * 0.32;
        const sunR = Math.min(30, w * 0.05);
        ctx.fillStyle = 'rgba(251, 191, 36, 0.25)';
        ctx.beginPath();
        ctx.arc(sunX, sunY, sunR + 12 + (isPlaying ? Math.sin(t * 0.1) * 4 : 0), 0, TAU);
        ctx.fill();
        ctx.fillStyle = '#f59e0b';
        ctx.beginPath();
        ctx.arc(sunX, sunY, sunR, 0, TAU);
        ctx.fill();

        drawLabel(ctx, '☀️ 太陽的光與熱：發電・植物生長・動物取暖', w * 0.62, h * 0.13, fs + 2, '#fde68a', 'center');

        // Solar panel
        const panelW = Math.max(110, w * 0.17);
        const panelH = h * 0.17;
        const panelX = w * 0.17;
        const panelY = h * 0.58;
        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(panelX + panelW / 2, panelY + panelH);
        ctx.lineTo(panelX + panelW / 2, groundY);
        ctx.stroke();
        ctx.fillStyle = '#1e3a8a';
        ctx.fillRect(panelX, panelY, panelW, panelH);
        ctx.strokeStyle = '#60a5fa';
        ctx.lineWidth = 3;
        ctx.strokeRect(panelX, panelY, panelW, panelH);
        ctx.strokeStyle = '#3b82f6';
        ctx.lineWidth = 1.5;
        for (let i = 1; i < 4; i++) {
          ctx.beginPath();
          ctx.moveTo(panelX + (panelW / 4) * i, panelY);
          ctx.lineTo(panelX + (panelW / 4) * i, panelY + panelH);
          ctx.stroke();
        }
        drawLabel(ctx, '矽晶太陽能板', panelX + panelW / 2, panelY + panelH / 2 + 5, fs - 1, '#ffffff', 'center');

        // Plant (grows with sunlight)
        const plantX = w * 0.63;
        const stem = h * 0.12 + h * 0.16 * (isPlaying ? 0.5 + 0.5 * Math.sin(t * 0.03) : 0.6);
        const topY = groundY - stem;
        ctx.fillStyle = '#78350f';
        ctx.beginPath();
        ctx.ellipse(plantX, groundY, 28, 8, 0, 0, TAU);
        ctx.fill();
        ctx.strokeStyle = '#22c55e';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(plantX, groundY);
        ctx.lineTo(plantX, topY);
        ctx.stroke();
        ctx.fillStyle = '#4ade80';
        ctx.beginPath();
        ctx.ellipse(plantX - 14, groundY - stem * 0.45, 14, 6, -0.5, 0, TAU);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(plantX + 14, groundY - stem * 0.65, 14, 6, 0.5, 0, TAU);
        ctx.fill();
        ctx.font = '34px "Noto Sans TC"';
        ctx.textAlign = 'center';
        ctx.fillText('🌻', plantX, topY + 6);
        ctx.textAlign = 'left';
        drawLabel(ctx, '植物：需要陽光才能長大', plantX, groundY + (h - groundY) / 2 + 5, fs, '#ffffff', 'center');

        // Animal (warmed by sunlight)
        const animalX = w * 0.84;
        const bob = isPlaying ? Math.sin(t * 0.1) * 2 : 0;
        ctx.font = '46px "Noto Sans TC"';
        ctx.textAlign = 'center';
        ctx.fillText('🐑', animalX, groundY - 2 + bob);
        ctx.textAlign = 'left';
        if (isPlaying) {
          ctx.strokeStyle = 'rgba(248, 113, 113, 0.85)';
          ctx.lineWidth = 3;
          for (let i = 0; i < 3; i++) {
            const lx = animalX - 24 + i * 24;
            const base = groundY - 58 - ((t * 0.6 + i * 14) % 30);
            ctx.beginPath();
            for (let k = 0; k <= 18; k += 3) {
              const px = lx + Math.sin((base + k) * 0.35) * 5;
              if (k === 0) ctx.moveTo(px, base - k);
              else ctx.lineTo(px, base - k);
            }
            ctx.stroke();
          }
        }
        drawLabel(ctx, '動物：需要太陽的熱取暖', animalX, groundY + (h - groundY) / 2 + 5, fs, '#ffffff', 'center');

        // Sunlight photons to panel / plant / animal
        if (isPlaying) {
          const targets = [
            { x: panelX + panelW * 0.4, y: panelY },
            { x: plantX, y: topY - 14 },
            { x: animalX, y: groundY - 52 }
          ];
          ctx.fillStyle = '#fde68a';
          targets.forEach((tg, k) => {
            for (let i = 0; i < 4; i++) {
              const p = ((t * 0.012 + i * 0.25 + k * 0.1) % 1);
              const rx = sunX + (tg.x - sunX) * p;
              const ry = sunY + (tg.y - sunY) * p;
              ctx.beginPath();
              ctx.arc(rx, ry, 4, 0, TAU);
              ctx.fill();
            }
          });
        }

        // Wire: panel → 電能
        drawWireAndBulb(ctx, panelX + panelW, panelY + panelH / 2, w * 0.45, h * 0.36, t);
      };

      // 4. Wind Turbine
      const renderWindTurbine = (ctx, w, h, t) => {
        if (isPlaying) {
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 3;
          for (let i = 0; i < 4; i++) {
            const wx = (t * 4 + i * 80) % (w * 0.5);
            ctx.beginPath();
            ctx.moveTo(wx, h * 0.2 + i * 35);
            ctx.lineTo(wx + 45, h * 0.2 + i * 35);
            ctx.stroke();
          }
        }

        const tx = w * 0.45;
        const ty = h * 0.45;
        ctx.fillStyle = '#94a3b8';
        ctx.fillRect(tx - 7, ty, 14, 120);

        // 塔內導線：發電機 → 塔底
        ctx.strokeStyle = isPlaying ? '#f59e0b' : '#475569';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(tx, ty);
        ctx.lineTo(tx, ty + 112);
        ctx.stroke();

        // 機艙內的發電機
        ctx.fillStyle = '#059669';
        ctx.fillRect(tx + 6, ty - 13, 54, 26);
        ctx.strokeStyle = '#34d399';
        ctx.lineWidth = 2;
        ctx.strokeRect(tx + 6, ty - 13, 54, 26);
        drawLabel(ctx, '發電機', tx + 33, ty + 5, 13, '#ffffff', 'center');

        ctx.save();
        ctx.translate(tx, ty);
        ctx.rotate(isPlaying ? t * 0.08 : 0);
        ctx.fillStyle = '#f8fafc';
        for (let i = 0; i < 3; i++) {
          ctx.rotate(TAU / 3);
          ctx.beginPath();
          ctx.ellipse(0, -50, 9, 50, 0, 0, TAU);
          ctx.fill();
        }
        ctx.restore();

        ctx.fillStyle = '#38bdf8';
        ctx.beginPath();
        ctx.arc(tx, ty, 12, 0, TAU);
        ctx.fill();

        drawWireAndBulb(ctx, tx, ty + 112, w * 0.85, h * 0.6, t);
      };

      // 5. Ocean Wave Power
      const renderOceanWave = (ctx, w, h, t) => {
        ctx.fillStyle = '#1d4ed8';
        ctx.beginPath();
        ctx.moveTo(0, h);
        for (let x = 0; x <= w * 0.65; x += 10) {

        }
        ctx.lineTo(w * 0.65, h);
        ctx.closePath();
        ctx.fill();

        const sx = w * 0.33;
        const floatY = h * 0.58 + Math.sin(w * 0.3 * 0.03 + (isPlaying ? t * 0.1 : 0)) * 20;

        // 傳動軸（浮筒上下 → 帶動發電機）

      // 6. Geothermal Plant
      const renderGeothermalPlant = (ctx, w, h, t) => {

        ctx.fillRect(0, h * 0.6, w * 0.65, h * 0.4);

        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(w * 0.15, h * 0.3);
        ctx.lineTo(w * 0.15, h * 0.75);
        ctx.stroke();

        ctx.strokeStyle = '#f97316';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(w * 0.45, h * 0.75);
        ctx.lineTo(w * 0.45, h * 0.3);
        ctx.lineTo(w * 0.65 + 2, h * 0.3);
        ctx.stroke();

        if (isPlaying) {
          ctx.fillStyle = '#ffffff';
          for (let i = 0; i < 4; i++) {
            const sy = h * 0.75 - ((t * 2 + i * 35) % (h * 0.45));
            ctx.beginPath();
            ctx.arc(w * 0.45, sy, 5, 0, TAU);
            ctx.fill();

        drawTurbineAndBulb(ctx, w, h, w * 0.65 + 30, h * 0.3, t, '汽輪機', '發電機', w * 0.9, h * 0.72);
      };

      // 7. Hydroelectric Dam：水從高處衝下帶動水輪機 → 發電機
      const renderHydroDam = (ctx, w, h, t) => {
        const waterTop = h * 0.22;
        const resW = w * 0.34;
        const tx = w * 0.57;
        const ty = h * 0.74;
        const R = Math.min(34, h * 0.11);

        // 水庫
        ctx.fillStyle = '#0284c7';
        ctx.fillRect(0, waterTop, resW, h - waterTop);
        ctx.fillStyle = '#38bdf8';
        ctx.beginPath();
        ctx.moveTo(0, waterTop);
        for (let x = 0; x <= resW; x += 8) {
          ctx.lineTo(x, waterTop + Math.sin(x * 0.05 + (isPlaying ? t * 0.08 : 0)) * 3);
        }
        ctx.lineTo(resW, waterTop + 9);
        ctx.lineTo(0, waterTop + 9);
        ctx.closePath();
        ctx.fill();
        drawLabel(ctx, '水庫（高處蓄水）', w * 0.03, h * 0.66, 15, '#ffffff');

        // 下游流出的水
        const tailX = w * 0.46;
        const tailW = w * 0.34;
        const tailTop = h * 0.9;
        ctx.fillStyle = '#1d4ed8';
        ctx.beginPath();
        ctx.moveTo(tailX, h);
        for (let x = 0; x <= tailW; x += 8) {
          ctx.lineTo(tailX + x, tailTop + Math.sin(x * 0.06 - (isPlaying ? t * 0.12 : 0)) * 3);
        }
        ctx.lineTo(tailX + tailW, h);
        ctx.closePath();
        ctx.fill();
        drawLabel(ctx, '流出的水', tailX + tailW * 0.55, h * 0.975, 13, '#dbeafe', 'center');

        // 水壩
        ctx.fillStyle = '#64748b';
        ctx.beginPath();
        ctx.moveTo(w * 0.34, h * 0.2);
        ctx.lineTo(w * 0.4, h * 0.2);
        ctx.lineTo(w * 0.46, h * 0.93);
        ctx.lineTo(w * 0.34, h * 0.93);
        ctx.closePath();
        ctx.fill();
        drawLabel(ctx, '水壩', w * 0.35, h * 0.88, 15, '#f1f5f9');

        // 水管路徑：入水口 → 穿過水壩 → 往下衝向水輪機
        const pts = [
          { x: w * 0.3, y: h * 0.32 },
          { x: w * 0.38, y: h * 0.32 },
          { x: tx, y: h * 0.5 },
          { x: tx, y: ty - R - 22 }
        ];
        ctx.lineJoin = 'round';
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 18;
        ctx.beginPath();
        pts.forEach((p, i) => (i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y)));
        ctx.stroke();
        ctx.strokeStyle = '#0ea5e9';
        ctx.lineWidth = 11;
        ctx.beginPath();
        pts.forEach((p, i) => (i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y)));
        ctx.stroke();

        // 水管裡流動的水滴
        const segs = [];
        let total = 0;
        for (let i = 0; i < pts.length - 1; i++) {
          const len = Math.hypot(pts[i + 1].x - pts[i].x, pts[i + 1].y - pts[i].y);
          segs.push(len);
          total += len;
        }
        if (isPlaying) {
          ctx.fillStyle = '#e0f2fe';
          for (let i = 0; i < 12; i++) {
            let d = (t * 3 + (i * total) / 12) % total;
            let k = 0;
            while (k < segs.length - 1 && d > segs[k]) {
              d -= segs[k];
              k++;
            }
            const r = d / segs[k];
            const px = pts[k].x + (pts[k + 1].x - pts[k].x) * r;
            const py = pts[k].y + (pts[k + 1].y - pts[k].y) * r;
            ctx.beginPath();
            ctx.arc(px, py, 3.5, 0, TAU);
            ctx.fill();
          }
        }
        drawLabel(ctx, '水流衝下來 ⬇', tx + 16, h * 0.5 + 4, 14, '#7dd3fc');

        // 水柱沖擊水輪機
        const jetY = ty - R - 22;
        if (isPlaying) {
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 8;
          ctx.beginPath();
          ctx.moveTo(tx, jetY);
          ctx.lineTo(tx, ty - R + 4);
          ctx.stroke();
          ctx.fillStyle = '#e0f2fe';
          for (let i = 0; i < 4; i++) {
            const py = jetY + ((t * 2.5 + i * 8) % (R + 26));
            ctx.beginPath();
            ctx.arc(tx + Math.sin(t * 0.3 + i) * 2, py, 3, 0, TAU);
            ctx.fill();
          }
          // 水花
          ctx.fillStyle = 'rgba(224, 242, 254, 0.8)';
          for (let i = 0; i < 4; i++) {
            const a = Math.PI + (i / 3) * Math.PI + Math.sin(t * 0.2) * 0.1;
            const dist = 8 + ((t * 1.2 + i * 6) % 14);
            ctx.beginPath();
            ctx.arc(tx + Math.cos(a) * (R * 0.5 + dist), ty - R + Math.sin(a) * dist * 0.6, 2.5, 0, TAU);
            ctx.fill();
          }
        }

        // 水輪機
        ctx.save();
        ctx.translate(tx, ty);
        ctx.rotate(isPlaying ? t * 0.12 : 0);
        ctx.fillStyle = '#38bdf8';
        for (let i = 0; i < 8; i++) {
          ctx.rotate(Math.PI / 4);
          ctx.fillRect(-5, -R, 10, R * 0.7);
        }
        ctx.restore();
        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(tx, ty, R, 0, TAU);
        ctx.stroke();
        ctx.fillStyle = '#cbd5e1';
        ctx.beginPath();
        ctx.arc(tx, ty, 7, 0, TAU);
        ctx.fill();
        drawLabel(ctx, '水輪機', tx + R + 6, ty - R - 2, 14, '#cbd5e1');

        // 轉軸 → 發電機 → 電能
        drawGeneratorBulb(ctx, w, h, tx + R, ty, t, '發電機', w * 0.88, h * 0.5);
      };

      // 8. Biomass Digester
      const renderBiomassDigester = (ctx, w, h, t) => {
        const tx = w * 0.25;
        const ty = h * 0.45;
        ctx.fillStyle = '#065f46';
        ctx.fillRect(tx, ty, 120, 95);
        ctx.strokeStyle = '#10b981';
        ctx.lineWidth = 3;
        ctx.strokeRect(tx, ty, 120, 95);
        drawLabel(ctx, '密閉沼氣發酵槽', tx + 10, ty + 50, 15, '#ffffff');

        if (isPlaying) {
          ctx.fillStyle = '#a7f3d0';
          for (let i = 0; i < 5; i++) {
            const bx = tx + 20 + i * 20;
            const by = ty + 75 - ((t + i * 15) % 45);
            ctx.beginPath();
            ctx.arc(bx, by, 5, 0, TAU);
            ctx.fill();
          }
        }

        ctx.strokeStyle = '#fbbf24';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(tx + 60, ty);
        ctx.lineTo(tx + 60, h * 0.3);
        ctx.lineTo(w * 0.65 + 2, h * 0.3);
        ctx.stroke();

        drawTurbineAndBulb(ctx, w, h, w * 0.65 + 30, h * 0.3, t, '沼氣引擎', '發電機', w * 0.9, h * 0.72);
      };

      return (
        <div class="relative w-full bg-slate-900 rounded-2xl overflow-hidden border border-slate-700 shadow-inner">
          <canvas ref={canvasRef} class="w-full h-[270px] md:h-[320px] block" />
          <div class="absolute top-3 left-4 bg-slate-950/85 backdrop-blur-md px-4 py-1.5 rounded-full text-sm font-bold text-slate-200 border border-slate-700 flex items-center gap-2.5">
            <span class={`w-3 h-3 rounded-full ${isPlaying ? 'bg-emerald-400 animate-ping' : 'bg-amber-400'}`}></span>
            <span>{isPlaying ? '發電廠模擬動態運轉中...' : '已暫停（請點擊下方播放）'}</span>
          </div>
        </div>
      );
    }

    const PHOTO_BAD_WORDS = /\b(map|maps|diagram|logo|chart|flag|icon|poster|schematic|drawing|plan|scheme|graph|screenshot|cover|banner|stamp|coat of arms)\b/i;
    const photoCache = {}; // 同一關鍵字只抓一次，切換更快

    const stripHtml = (html) => {
      if (!html) return '';
      const d = document.createElement('div');
      d.innerHTML = html;
      return (d.textContent || '').trim();
    };

    async function fetchEnergyPhotos(query, signal) {
      if (photoCache[query]) return photoCache[query];
      const params = new URLSearchParams({
        action: 'query',
        format: 'json',
        origin: '*',
        generator: 'search',
        gsrnamespace: '6',
        gsrlimit: '30',
        gsrsearch: 'filetype:bitmap ' + query,
        prop: 'imageinfo',
        iiprop: 'url|size|mime|extmetadata',
        iiurlwidth: '900',
        iiextmetadatafilter: 'Artist|LicenseShortName|ObjectName'
      });
      const res = await fetch('https://commons.wikimedia.org/w/api.php?' + params.toString(), { signal });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const json = await res.json();
      const pages = json && json.query && json.query.pages ? Object.values(json.query.pages) : [];
      const photos = pages
        .sort((a, b) => (a.index || 0) - (b.index || 0))
        .map((p) => {
          const info = p.imageinfo && p.imageinfo[0];
          if (!info) return null;
          const meta = info.extmetadata || {};
          const title = (p.title || '').replace(/^File:/, '').replace(/\.[a-z0-9]+$/i, '');
          return {
            id: p.pageid,
            title,
            thumb: info.thumburl || info.url,
            full: info.thumburl || info.url,
            width: info.width,
            height: info.height,
            mime: info.mime,
            page: info.descriptionurl,
            author: stripHtml(meta.Artist && meta.Artist.value).slice(0, 60),
            license: meta.LicenseShortName ? meta.LicenseShortName.value : ''
          };
        })
        .filter((x) => x && /^image\/(jpeg|png)$/.test(x.mime) && x.width >= 800 && x.height >= 500 && !PHOTO_BAD_WORDS.test(x.title))
        .slice(0, 9);
      photoCache[query] = photos;
      return photos;
    }

              {status === 'ok' && visible.length > 0 && (
                <>
                  <div className="grid grid-cols-2 md:grid-cols-3 gap-4">

                <a href={current.page} target="_blank" rel="noopener noreferrer" className="inline-block text-sm text-sky-300 underline font-bold">

              {visible.length > 1 && (
                <>
                  <button
                    className="absolute left-3 top-1/2 -translate-y-1/2 w-14 h-14 rounded-full bg-white/20 text-white text-2xl flex items-center justify-center"

    // 1. Sorting Game Component
    const INITIAL_SORT_ITEMS = [
      { name: '煤炭 🧱', category: 'non-renewable' },
      { name: '太陽能 ☀️', category: 'renewable' },
      { name: '石油 🛢️', category: 'non-renewable' },
      { name: '風能 🌬️', category: 'renewable' },
      { name: '天然氣 ♨️', category: 'non-renewable' },
      { name: '地熱能 🌋', category: 'renewable' },
      { name: '核能 ⚛️', category: 'non-renewable' },
      { name: '水力能 💧', category: 'renewable' },
      { name: '海洋能 🌊', category: 'renewable' },
      { name: '生質能 🌾', category: 'renewable' }
    ];

    function SortingGameComponent() {
      const [deck, setDeck] = useState(() => [...INITIAL_SORT_ITEMS].sort(() => Math.random() - 0.5));
      const [nonRenewableBucket, setNonRenewableBucket] = useState([]);
      const [renewableBucket, setRenewableBucket] = useState([]);
      const [msg, setMsg] = useState(null);

      const classify = (item, targetCat) => {
        if (item.category === targetCat) {
          setMsg({ type: 'success', text: `答對了！${item.name} 歸類正確！` });
          if (targetCat === 'non-renewable') {
            setNonRenewableBucket((prev) => [...prev, item]);
          } else {
            setRenewableBucket((prev) => [...prev, item]);
          }
          setDeck((prev) => prev.filter((i) => i.name !== item.name));
        } else {
          setMsg({ type: 'error', text: `再想一下喔～ ${item.name} 放錯類別囉！` });
        }
        setTimeout(() => setMsg(null), 1800);
      };

      const resetGame = () => {
        setDeck([...INITIAL_SORT_ITEMS].sort(() => Math.random() - 0.5));
        setNonRenewableBucket([]);
        setRenewableBucket([]);
      };

      const isCompleted = deck.length === 0;

      useEffect(() => {
        if (isCompleted && (nonRenewableBucket.length > 0 || renewableBucket.length > 0)) {
          confetti({ particleCount: 120, spread: 70, origin: { y: 0.6 } });
        }
      }, [isCompleted]);

      return (
        <div class="bg-white rounded-3xl p-6 md:p-9 shadow-xl border border-slate-200 space-y-6">
          <div class="flex items-center justify-between">
            <h3 class="ipad-subtitle font-black text-slate-900">🧺 點選按鈕進行能源歸類：</h3>
            <button
              onClick={resetGame}
              class="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-800 rounded-xl font-bold text-sm"
            >
              重新挑戰
            </button>
          </div>

          {msg && (
            <div className={`p-4 rounded-2xl font-black text-center text-base ${msg.type === 'success' ? 'bg-emerald-100 text-emerald-950 border border-emerald-300' : 'bg-rose-100 text-rose-950 border border-rose-300'}`}>
              {msg.text}
            </div>
          )}

          {!isCompleted ? (
            <div class="bg-slate-50 border-2 border-dashed border-slate-300 rounded-3xl p-6 flex flex-wrap justify-center gap-4">
              {deck.map((item) => (
                <div key={item.name} class="bg-white p-4 rounded-2xl border-2 border-slate-300 shadow-sm flex items-center gap-3">
                  <span class="font-black text-slate-900 text-lg md:text-xl">{item.name}</span>
                  <div class="flex gap-1.5">
                    <button
                      onClick={() => classify(item, 'non-renewable')}
                      class="px-3.5 py-2 bg-amber-800 text-white text-sm font-black rounded-xl hover:bg-amber-900"
                    >
                      不可再生
                    </button>
                    <button
                      onClick={() => classify(item, 'renewable')}
                      class="px-3.5 py-2 bg-emerald-600 text-white text-sm font-black rounded-xl hover:bg-emerald-700"
                    >
                      可再生
                    </button>
                  </div>
                </div>
              ))}
            </div>
          ) : (
            <div class="bg-emerald-50 border-2 border-emerald-300 rounded-3xl p-9 text-center space-y-3">
              <div class="text-5xl">🎉</div>
              <h4 class="font-black text-emerald-950 text-2xl">太優秀了！所有能源分類完全正確！</h4>
            </div>
          )}

          <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div class="bg-amber-50 border-2 border-amber-200 rounded-3xl p-5 space-y-3">
              <h4 class="font-black text-amber-950 text-base md:text-lg">🪨 不可再生能源桶 ({nonRenewableBucket.length})</h4>
              <div class="flex flex-wrap gap-2.5">
                {nonRenewableBucket.map((i, idx) => (
                  <span key={idx} class="bg-amber-800 text-white font-black text-sm px-4 py-1.5 rounded-xl">
                    {i.name}
                  </span>
                ))}
              </div>
            </div>

            <div class="bg-emerald-50 border-2 border-emerald-200 rounded-3xl p-5 space-y-3">
              <h4 class="font-black text-emerald-950 text-base md:text-lg">🌿 可再生能源桶 ({renewableBucket.length})</h4>
              <div class="flex flex-wrap gap-2.5">
                {renewableBucket.map((i, idx) => (
                  <span key={idx} class="bg-emerald-700 text-white font-black text-sm px-4 py-1.5 rounded-xl">
                    {i.name}
                  </span>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // 2. Quiz Component
    const QUIZ_QUESTIONS = [
      {
        q: "1. 太陽能發電主要利用光線照射哪一種特製材料，產生光電效應讓電子流動發電？",
        options: ["A. 矽晶片", "B. 塑膠板", "C. 鐵皮屋頂"],
        ans: 0,
        exp: "正確！太陽能板是由「矽晶圓」組成的，光線撞擊會激發電子流動發電！"
      },
      {
        q: "2. 水力發電是利用水流的什麼力量來衝擊水輪機發電？",
        options: ["A. 高處往低處衝下的重力位能與動能", "B. 水沸騰產生的蒸氣", "C. 水中魚兒游動的力量"],
        ans: 0,
        exp: "太棒了！水庫高水位衝下來的強勁水流擁有巨大動能！"
      },
      {
        q: "3. 在台灣，家庭常用的「桶裝瓦斯」主要成分是丙烷與丁烷，外洩時會怎樣飄散？",
        options: ["A. 比空氣重，會沉降在地面或低窪處", "B. 比空氣輕，會快速往上飄散", "C. 變成液體積水"],
        ans: 0,
        exp: "完全正確！桶裝瓦斯（液化石油氣 LPG）比空氣重，外洩時會沉降在地面！"
      }
    ];

    function QuizComponent() {
      const [idx, setIdx] = useState(0);
      const [selected, setSelected] = useState(null);
      const [submitted, setSubmitted] = useState(false);
      const [score, setScore] = useState(0);

      const currentQ = QUIZ_QUESTIONS[idx];

      const submitAns = () => {
        if (selected === null) return;
        setSubmitted(true);
        if (selected === currentQ.ans) setScore((prev) => prev + 33);
      };

      const nextQ = () => {
        if (idx + 1 < QUIZ_QUESTIONS.length) {
          setIdx((prev) => prev + 1);
          setSelected(null);
          setSubmitted(false);
        }
      };

      return (
        <div class="bg-white rounded-3xl p-6 md:p-9 shadow-xl border border-slate-200 space-y-6">
          <div class="flex justify-between items-center border-b pb-4">
            <span class="font-black text-slate-600 text-base">問題 {idx + 1} / {QUIZ_QUESTIONS.length}</span>
            <span class="font-black text-indigo-700 text-base">得分: {score}</span>
          </div>

          <h3 class="ipad-subtitle font-black text-slate-900">{currentQ.q}</h3>

          <div class="space-y-3.5">
            {currentQ.options.map((opt, i) => (
              <button
                key={i}
                disabled={submitted}
                onClick={() => setSelected(i)}
                class={`w-full text-left p-5 rounded-2xl border-2 font-black text-lg transition-all ${
                  selected === i ? 'bg-indigo-50 border-indigo-600 text-indigo-950 shadow-sm' : 'bg-slate-50 border-slate-200'
                } ${submitted && i === currentQ.ans ? 'bg-emerald-100 border-emerald-600 text-emerald-950' : ''}`}
              >
                {opt}
              </button>
            ))}
          </div>

          {submitted && (
            <div class="p-5 rounded-2xl bg-slate-100 text-slate-900 text-base md:text-lg font-bold border border-slate-200">
              💡 {currentQ.exp}
            </div>
          )}

          <div class="flex justify-end pt-3">
            {!submitted ? (
              <button
                onClick={submitAns}
                disabled={selected === null}
                class="px-7 py-3.5 bg-indigo-600 text-white rounded-2xl font-black text-base shadow-md disabled:opacity-50"
              >
                確認答案
              </button>
            ) : (
              idx + 1 < QUIZ_QUESTIONS.length && (
                <button
                  onClick={nextQ}
                  class="px-7 py-3.5 bg-emerald-600 text-white rounded-2xl font-black text-base shadow-md"
                >
                  下一題 ➔
                </button>
              )
            )}
          </div>
        </div>
      );
    }

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
