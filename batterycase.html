<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>電池盒與燈泡座結構解說圖｜國小自然科學互動教學</title>
  <!-- 載入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 載入適合繁體中文閱讀的 Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />

  <style>
    /* 全局字體與基礎觸控優化 */
    body {
      font-family: 'Noto Sans TC', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* 觸控按鈕防止雙擊縮放延遲並確保最小觸控高度 */
    .touch-btn {
      touch-action: manipulation;
      min-height: 44px;
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .touch-btn:active {
      transform: scale(0.96);
    }

    /* 僅在支援滑鼠懸停的裝置啟用 hover 效果，避免平板觸控後狀態卡死 */
    @media (hover: hover) {
      .touch-btn:hover {
        transform: translateY(-1px);
      }
      .svg-part-interactive:hover {
        cursor: pointer;
      }
      .callout-pill:hover {
        cursor: pointer;
        filter: brightness(1.03);
      }
    }

    /* SVG 互動部位平滑彈性放大動畫 */
    .svg-part {
      transform-box: fill-box;
      transform-origin: center;
      transition: transform 0.36s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.28s ease, filter 0.28s ease;
      cursor: pointer;
    }

    /* 聚光燈模式：未選取的部位降低對比與透明度 */
    .canvas-has-selection .svg-dimmable {
      opacity: 0.38;
    }

    /* 純向量外框光暈（避免使用會產生點陣模糊的 CSS/SVG drop-shadow 濾鏡） */
    .vector-halo {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .is-selected > .vector-halo,
    .is-selected .vector-halo-group {
      opacity: 1;
    }

    /* 被點選選取的部位：恢復 100% 不透明度並呈現彈性微放大 */
    .canvas-has-selection .svg-part.is-selected {
      opacity: 1 !important;
    }

    /* 細部零件微微放大倍率（1.08倍） */
    .svg-subpart.is-selected {
      transform: scale(1.08);
    }

    /* 整個大元件微微放大倍率（1.05倍，避免超出畫布邊界） */
    .svg-mainpart.is-selected {
      transform: scale(1.05);
    }

    /* 圖上引線標籤樣式與選取高亮 */
    .callout-group {
      transform-box: fill-box;
      transform-origin: center;
      transition: transform 0.32s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s ease;
      cursor: pointer;
    }
    .canvas-has-selection .callout-group {
      opacity: 0.32;
    }
    .canvas-has-selection .callout-group.is-selected {
      opacity: 1 !important;
      transform: scale(1.1);
    }

    /* 左側原生 SVG 縮放與拖曳視口（直接操作 SVG viewBox，100% 向量無損清晰） */
    .diagram-viewport {
      cursor: grab;
      touch-action: none;
      overflow: hidden;
    }
    .diagram-viewport.is-panning {
      cursor: grabbing;
    }
    .diagram-svg-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* 模式 B：電流流動虛線動畫 */
    @keyframes flowCurrent {
      to {
        stroke-dashoffset: -36;
      }
    }
    .current-flow-line {
      stroke-dasharray: 8 10;
      animation: flowCurrent 0.9s linear infinite;
    }

    /* 燈泡發光呼吸動畫 */
    @keyframes bulbGlowPulse {
      0%, 100% {
        opacity: 0.88;
        transform: scale(1);
      }
      50% {
        opacity: 1;
        transform: scale(1.06);
      }
    }
    .bulb-glow-active {
      animation: bulbGlowPulse 1.8s ease-in-out infinite;
    }

    /* 自訂捲軸美化 */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- 頂部導覽與模式切換列 -->
  <header class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <!-- 標題區 -->
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-amber-400 to-orange-500 text-white flex items-center justify-center shadow-md shrink-0">
          <!-- 燈泡圖示 SVG -->
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18h6" />
            <path d="M10 22h4" />
            <path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14" />
          </svg>
        </div>
        <div>
          <h1 class="text-lg sm:text-xl font-extrabold text-slate-800 tracking-tight leading-tight">
            電池盒與燈泡座結構解說圖
          </h1>
          <p class="text-xs sm:text-sm text-slate-500 font-medium">
            國小自然科學「電路」單元｜點擊結構名稱或圖示部位可放大觀察構造
          </p>
        </div>
      </div>

      <!-- 雙模式切換與重設按鈕 -->
      <div class="flex flex-wrap items-center gap-2 w-full sm:w-auto justify-end">
        <div class="inline-flex rounded-xl bg-slate-100 p-1 border border-slate-200 w-full sm:w-auto" role="tablist">
          <button
            id="btn-mode-a"
            type="button"
            onclick="switchMode('A')"
            class="touch-btn flex-1 sm:flex-initial px-4 py-2 rounded-lg text-sm font-bold bg-blue-600 text-white shadow-sm flex items-center justify-center gap-1.5"
          >
            <span>🔍</span>
            <span>結構探索解說</span>
          </button>
          <button
            id="btn-mode-b"
            type="button"
            onclick="switchMode('B')"
            class="touch-btn flex-1 sm:flex-initial px-4 py-2 rounded-lg text-sm font-bold text-slate-600 hover:text-slate-900 flex items-center justify-center gap-1.5"
          >
            <span>⚡</span>
            <span>通路組裝模擬</span>
          </button>
        </div>

        <button
          id="btn-reset-view"
          type="button"
          onclick="resetAllView()"
          class="touch-btn px-3.5 py-2 rounded-xl bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-300 text-sm font-bold flex items-center gap-1.5 shadow-sm"
          title="恢復所有部位原始大小與畫面縮放"
        >
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
            <path d="M3 3v5h5" />
          </svg>
          <span>重設畫面</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 主內容雙欄自適應佈局 -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-4 py-4 grid grid-cols-1 lg:grid-cols-12 gap-4 items-start">

    <!-- 左側／上方：互動式高解析度 SVG 圖解畫布 (佔 7 欄) -->
    <section class="lg:col-span-7 bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden flex flex-col">
      <!-- 畫布頂部操作提示條 -->
      <div class="px-4 py-2.5 bg-slate-50 border-b border-slate-200 flex flex-wrap items-center justify-between gap-2 text-xs sm:text-sm">
        <div class="flex items-center gap-2 text-slate-700 font-semibold">
          <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
          <span id="canvas-status-text">提示：滾輪可無損放大至 400%，拖曳可移動，雙擊部位可拉近特寫！</span>
        </div>
        <span id="selected-badge" class="hidden px-2.5 py-0.5 rounded-full bg-amber-100 text-amber-800 border border-amber-300 font-bold text-xs">
          已放大：無
        </span>
      </div>

      <!-- 模式 B 專用組裝控制列（切換至模式 B 時顯示） -->
      <div id="mode-b-controls" class="hidden px-4 py-3 bg-indigo-50/80 border-b border-indigo-100 flex flex-wrap items-center justify-between gap-2">
        <div class="flex flex-wrap items-center gap-2">
          <button
            id="btn-step-battery"
            type="button"
            onclick="toggleAssemblyStep('battery')"
            class="touch-btn px-3.5 py-2 rounded-xl bg-white border-2 border-slate-300 text-slate-700 text-sm font-bold flex items-center gap-1.5 shadow-sm"
          >
            <span>🔋</span>
            <span>1. 裝入電池</span>
          </button>
          <button
            id="btn-step-bulb"
            type="button"
            onclick="toggleAssemblyStep('bulb')"
            class="touch-btn px-3.5 py-2 rounded-xl bg-white border-2 border-slate-300 text-slate-700 text-sm font-bold flex items-center gap-1.5 shadow-sm"
          >
            <span>💡</span>
            <span>2. 旋入燈泡</span>
          </button>
          <button
            id="btn-step-wires"
            type="button"
            onclick="toggleAssemblyStep('wires')"
            class="touch-btn px-3.5 py-2 rounded-xl bg-white border-2 border-slate-300 text-slate-700 text-sm font-bold flex items-center gap-1.5 shadow-sm"
          >
            <span>🔌</span>
            <span>3. 接上紅黑導線</span>
          </button>
        </div>
        <button
          id="btn-quick-circuit"
          type="button"
          onclick="toggleAllAssembly()"
          class="touch-btn px-3.5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold shadow-sm"
        >
          ⚡ 一鍵接通電路
        </button>
      </div>

      <!-- 互動 SVG 畫布視口（直接動態更新 SVG viewBox 實現 75%~400% 無損向量縮放與拖曳） -->
      <div id="diagram-viewport" class="diagram-viewport relative w-full bg-gradient-to-b from-slate-50/70 to-white h-[400px] sm:h-[500px] lg:h-[575px] flex items-center justify-center p-2 sm:p-3">
        <!-- ===================================================================== -->
        <!-- 模式 A SVG：四大核心元件與細部構造拆解放大圖（原生向量銳利渲染）        -->
        <!-- ===================================================================== -->
        <svg
          id="svg-mode-a"
          viewBox="0 0 880 600"
          width="100%"
          height="100%"
          preserveAspectRatio="xMidYMid meet"
          shape-rendering="geometricPrecision"
          text-rendering="geometricPrecision"
          class="diagram-svg-canvas rounded-2xl select-none"
          xmlns="http://www.w3.org/2000/svg"
          aria-label="電池盒與燈泡座結構解說互動圖"
        >
          <defs>
            <!-- 背景網格樣式 -->
            <pattern id="lab-grid" width="24" height="24" patternUnits="userSpaceOnUse">
              <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#e2e8f0" stroke-width="0.7" />
            </pattern>

            <!-- 黃銅金屬漸層（燈泡座與平金屬片） -->
            <linearGradient id="brass-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#92600a" />
              <stop offset="22%" stop-color="#eab308" />
              <stop offset="48%" stop-color="#fef08a" />
              <stop offset="75%" stop-color="#ca8a04" />
              <stop offset="100%" stop-color="#78350f" />
            </linearGradient>
            <linearGradient id="brass-grad-v" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#fde047" />
              <stop offset="50%" stop-color="#eab308" />
              <stop offset="100%" stop-color="#a16207" />
            </linearGradient>

            <!-- 銀色金屬漸層（燈泡螺紋、彈簧、電池正負極） -->
            <linearGradient id="silver-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#64748b" />
              <stop offset="28%" stop-color="#cbd5e1" />
              <stop offset="52%" stop-color="#f8fafc" />
              <stop offset="78%" stop-color="#94a3b8" />
              <stop offset="100%" stop-color="#475569" />
            </linearGradient>
            <linearGradient id="silver-grad-v" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#f1f5f9" />
              <stop offset="45%" stop-color="#cbd5e1" />
              <stop offset="100%" stop-color="#64748b" />
            </linearGradient>

            <!-- 燈泡透明玻璃罩徑向漸層 -->
            <radialGradient id="bulb-glass-grad" cx="38%" cy="32%" r="65%">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92" />
              <stop offset="45%" stop-color="#e0f2fe" stop-opacity="0.48" />
              <stop offset="82%" stop-color="#bae6fd" stop-opacity="0.58" />
              <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.78" />
            </radialGradient>

            <!-- 乾電池藍金外皮漸層 -->
            <linearGradient id="battery-body-grad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#38bdf8" />
              <stop offset="25%" stop-color="#0284c7" />
              <stop offset="75%" stop-color="#0369a1" />
              <stop offset="100%" stop-color="#0c4a6e" />
            </linearGradient>
            <linearGradient id="battery-gold-band" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#fde047" />
              <stop offset="35%" stop-color="#f59e0b" />
              <stop offset="100%" stop-color="#b45309" />
            </linearGradient>

            <!-- 黑色塑膠電池盒漸層 -->
            <linearGradient id="plastic-dark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#334155" />
              <stop offset="45%" stop-color="#1e293b" />
              <stop offset="100%" stop-color="#0f172a" />
            </linearGradient>

            <!-- 紅色絕緣墊圈漸層 -->
            <linearGradient id="red-washer-grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ef4444" />
              <stop offset="55%" stop-color="#dc2626" />
              <stop offset="100%" stop-color="#991b1b" />
            </linearGradient>
          </defs>

          <!-- 點擊空白處可恢復原大小 -->
          <rect id="canvas-bg-rect" x="0" y="0" width="880" height="600" fill="url(#lab-grid)" rx="16" onclick="handleBgClick(event)" />

          <!-- 四大區塊背景分區卡片（視覺清晰分組） -->
          <!-- 左上：電池 -->
          <rect x="16" y="16" width="424" height="225" rx="18" fill="#ffffff" fill-opacity="0.86" stroke="#cbd5e1" stroke-width="1.5" onclick="handleBgClick(event)" />
          <!-- 左下：電池盒 -->
          <rect x="16" y="255" width="424" height="329" rx="18" fill="#ffffff" fill-opacity="0.86" stroke="#cbd5e1" stroke-width="1.5" onclick="handleBgClick(event)" />
          <!-- 右上：燈泡與燈泡座（側面視角） -->
          <rect x="454" y="16" width="410" height="335" rx="18" fill="#ffffff" fill-opacity="0.86" stroke="#cbd5e1" stroke-width="1.5" onclick="handleBgClick(event)" />
          <!-- 右下：燈泡座（底部仰視構造，對應圖二） -->
          <rect x="454" y="365" width="410" height="219" rx="18" fill="#fffbeb" fill-opacity="0.92" stroke="#fcd34d" stroke-width="1.5" onclick="handleBgClick(event)" />

          <!-- =============================================================== -->
          <!-- 區塊 1：電池 (AA Dry Cell Battery) - 左上                        -->
          <!-- =============================================================== -->
          <g id="group-battery" class="svg-part svg-mainpart svg-dimmable" ondblclick="focusOnPart('battery', event)">
            <rect class="vector-halo" x="22" y="22" width="412" height="213" rx="16" fill="none" stroke="#f59e0b" stroke-width="3.5" stroke-dasharray="8 5" />
            <!-- 區塊大標題按鈕 -->
            <g onclick="selectPart('battery', event)" class="cursor-pointer">
              <rect x="30" y="28" width="112" height="32" rx="10" fill="#0284c7" />
              <text x="86" y="49" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">🔋 電池 (3號)</text>
            </g>

            <!-- 1-1. 金屬正極 (＋) -->
            <g
              id="part-battery-pos"
              class="svg-part svg-subpart svg-dimmable"
              onclick="selectPart('battery-pos', event)"
              ondblclick="focusOnPart('battery-pos', event)"
            >
              <rect class="vector-halo" x="79" y="111" width="34" height="54" rx="8" fill="none" stroke="#f59e0b" stroke-width="3" />
              <!-- 透明點擊熱區擴大 -->
              <rect x="75" y="102" width="42" height="72" fill="transparent" />
              <!-- 凸起金屬正極帽 -->
              <rect x="86" y="118" width="22" height="40" rx="5" fill="url(#silver-grad-v)" stroke="#475569" stroke-width="1.8" />
              <ellipse cx="86" cy="138" rx="4" ry="18" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2" />
              <!-- 正極紅色標記圈 -->
              <circle cx="96" cy="95" r="11" fill="#ef4444" />
              <text x="96" y="100" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="900">＋</text>
            </g>

            <!-- 1-2. 電池外殼 -->
            <g
              id="part-battery-body"
              class="svg-part svg-subpart svg-dimmable"
              onclick="selectPart('battery-body', event)"
              ondblclick="focusOnPart('battery-body', event)"
            >
              <rect class="vector-halo" x="103" y="91" width="238" height="94" rx="13" fill="none" stroke="#f59e0b" stroke-width="3.2" />
              <!-- 電池圓柱主體 -->
              <rect x="108" y="96" width="228" height="84" rx="10" fill="url(#battery-body-grad)" stroke="#0f172a" stroke-width="2" />
              <!-- 正極端金色裝飾環 -->
              <rect x="108" y="96" width="66" height="84" rx="8" fill="url(#battery-gold-band)" stroke="#0f172a" stroke-width="1.5" />
              <!-- 高光反光條 -->
              <rect x="114" y="104" width="216" height="10" rx="5" fill="#ffffff" fill-opacity="0.32" />
              <!-- 電池文字標示 -->
              <text x="141" y="145" text-anchor="middle" fill="#78350f" font-size="22" font-weight="900">＋</text>
              <text x="242" y="135" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="800" letter-spacing="1">1.5V 乾電池</text>
              <text x="242" y="156" text-anchor="middle" fill="#bae6fd" font-size="12" font-weight="700">AA / 3號電池</text>
              <text x="316" y="145" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="900">－</text>
            </g>

            <!-- 1-3. 金屬負極 (－) -->
            <g
              id="part-battery-neg"
              class="svg-part svg-subpart svg-dimmable"
              onclick="selectPart('battery-neg', event)"
              ondblclick="focusOnPart('battery-neg', event)"
            >
              <rect class="vector-halo" x="331" y="97" width="22" height="82" rx="6" fill="none" stroke="#f59e0b" stroke-width="3" />
              <rect x="330" y="96" width="32" height="84" fill="transparent" />
              <!-- 平坦金屬負極端面 -->
              <rect x="336" y="102" width="12" height="72" rx="4" fill="url(#silver-grad-v)" stroke="#475569" stroke-width="1.8" />
              <circle cx="348" cy="95" r="11" fill="#334155" />
              <text x="348" y="100" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="900">－</text>
            </g>
          </g>

          <!-- =============================================================== -->
          <!-- 區塊 2：電池盒 (Single AA Black Battery Holder - 對應圖三) - 左下 -->
          <!-- =============================================================== -->
          <g id="group-battery-holder" class="svg-part svg-mainpart svg-dimmable" ondblclick="focusOnPart('battery-holder', event)">
            <rect class="vector-halo" x="22" y="261" width="412" height="317" rx="16" fill="none" stroke="#f59e0b" stroke-width="3.5" stroke-dasharray="8 5" />
            <!-- 區塊大標題按鈕 -->
            <g onclick="selectPart('battery-holder', event)" class="cursor-pointer">
              <rect x="30" y="268" width="136" height="32" rx="10" fill="#1e293b" />
              <text x="98" y="289" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">⬛ 電池盒 (單顆)</text>
            </g>

            <!-- 2-1. 紅黑導線 (Red & Black Wires - 還原圖三彎曲紅黑線) -->

    /**
     * =========================================================================
     * 2. 應用程式狀態管理（右側分頁狀態與原生 SVG viewBox 縮放平移狀態）
     * =========================================================================
     */
    let currentMode = 'A'; // 'A' = 結構探索解說, 'B' = 通路組裝模擬
    let activeTab = 'battery-holder';
    let selectedPartKey = null;

    // 原生 SVG viewBox 縮放與平移狀態（75% ~ 400% 無損向量清晰）
    const MIN_ZOOM = 0.75;
    const MAX_ZOOM = 4.0;
    const BASE_VIEWBOX = {
      A: { x: 0, y: 0, w: 880, h: 600 },
      B: { x: 0, y: 0, w: 880, h: 540 }
    };
    const viewBoxes = {
      A: { x: 0, y: 0, w: 880, h: 600 },
      B: { x: 0, y: 0, w: 880, h: 540 }
    };
    let viewAnimFrameId = null;
    let isPanning = false;
    let hasDragged = false;
    let dragStartClientX = 0;
    let dragStartClientY = 0;
    let dragStartSvgX = 0;
    let dragStartSvgY = 0;
    let dragStartViewBox = null;
    let initialPinchDist = null;
    let initialPinchZoom = 1.0;

    // 模式 B 組裝狀態
    const assemblyState = {
      battery: false,
      bulb: false,
      wires: false
    };

    /**
     * =========================================================================
     * 3. 右側四大元件分頁切換與動態按鈕渲染
     * =========================================================================
     */
    function switchComponentTab(tabKey, autoSelectOverview = true) {
      const tab = TAB_CONFIG[tabKey];
      if (!tab) return;

      // 1. 更新頂部 4 個分頁按鈕外觀

    /**
     * 同步右側分頁內按鈕的選取高亮狀態
     */
    function syncPartButtonHighlight(partKey) {
      document.querySelectorAll('[data-part-btn]').forEach((btn) => {
        if (btn.getAttribute('data-part-btn') === partKey) {
          btn.classList.add('ring-2', 'ring-amber-500', 'bg-amber-50', 'border-amber-400', 'scale-[1.02]');

    /**
     * =========================================================================
     * 4. 點選結構名稱／圖示部位：雙向同步分頁、局部放大與更新解說卡片
     * =========================================================================
     */
    function handleBgClick(event) {
      if (hasDragged) return;
      resetSelection();
    }

    function selectPart(partKey, event, forceSelect = false) {
      if (event) {
        event.stopPropagation();
      }
      // 若剛完成拖曳操作，忽略點擊事件避免誤觸
      if (hasDragged) return;

      const data = PART_DATA[partKey];
      if (!data) return;

      // 若重複點擊同一個已選取部位（且非切換分頁強制觸發），恢復該元件整體狀態
      if (!forceSelect && selectedPartKey === partKey) {
        resetSelection();
        return;
      }

      // 若點選的部位屬於不同分頁，自動切換右側分頁至該元件分頁
      if (data.tab && data.tab !== activeTab) {
        switchComponentTab(data.tab, false);
      }

      selectedPartKey = partKey;

      // 1. 清除先前的 SVG 選取狀態
      clearAllHighlightClasses();

      // 2. 啟動畫布聚光燈模式（未選取部位變淡）
      const svgA = document.getElementById('svg-mode-a');
      const svgB = document.getElementById('svg-mode-b');
      svgA.classList.add('canvas-has-selection');
      svgB.classList.add('canvas-has-selection');

      // 3. 針對對應的 SVG 部位加上 is-selected（觸發彈性放大與純向量發光外框）
      data.svgIds.forEach((id) => {
        const el = document.getElementById(id);
        if (el) {
          el.classList.add('is-selected');
          const parentGroup = el.closest('.svg-mainpart');
          if (parentGroup && parentGroup !== el) {
            parentGroup.style.opacity = '1';
            parentGroup.style.filter = 'none';
          }
        }
      });

      // 4. 高亮並放大對應的圖上引線標籤
      data.calloutIds.forEach((cid) => {
        const cel = document.getElementById(cid);
        if (cel) {
          cel.classList.add('is-selected');
        }
      });

      // 5. 高亮右側當前分頁中對應的結構按鈕
      syncPartButtonHighlight(partKey);

      // 6. 更新頂部已選取提示徽章
      const badge = document.getElementById('selected-badge');
      badge.textContent = `已放大聚焦：${data.title}`;
      badge.classList.remove('hidden');

      // 7. 更新即時結構解說卡片內容
      updateInfoCard(data);
    }

    /**
     * 清除所有放大與高亮樣式，恢復原始比例
     */
    function resetSelection() {
      selectedPartKey = null;
      clearAllHighlightClasses();

      const svgA = document.getElementById('svg-mode-a');
      const svgB = document.getElementById('svg-mode-b');
      svgA.classList.remove('canvas-has-selection');
      svgB.classList.remove('canvas-has-selection');

      const badge = document.getElementById('selected-badge');
      badge.classList.add('hidden');

      // 恢復當前分頁的整體構造說明
      const currentTabCfg = TAB_CONFIG[activeTab];

      }
    }

    /**
     * 輔助函式：移除所有元素上的選取與內聯樣式覆蓋
     */
    function clearAllHighlightClasses() {
      document.querySelectorAll('.svg-part').forEach((el) => {
        el.classList.remove('is-selected');
        el.style.opacity = '';
        el.style.filter = '';
      });
      document.querySelectorAll('.callout-group').forEach((el) => {
        el.classList.remove('is-selected');
      });
      document.querySelectorAll('[data-part-btn]').forEach((btn) => {
        btn.classList.remove('ring-2', 'ring-amber-500', 'bg-amber-50', 'border-amber-400', 'scale-[1.02]');
      });
    }

    /**
     * 更新右側即時結構解說卡片
     */
    function updateInfoCard(data) {
      document.getElementById('info-parent-badge').textContent = data.parent;
      document.getElementById('info-title').textContent = data.title;
      document.getElementById('info-icon-box').textContent = data.icon;
      document.getElementById('info-description').textContent = data.desc;
      document.getElementById('info-tip-text').textContent = data.tip;

      } else if (data.materialType === 'insulator') {
        matBadge.className = 'px-2.5 py-0.5 rounded-lg bg-emerald-100 text-emerald-800 border border-emerald-300 text-xs font-extrabold';
        card.className = 'bg-white rounded-3xl border-2 border-emerald-400 shadow-md p-4 sm:p-5 transition-all';
      } else {
        matBadge.className = 'px-2.5 py-0.5 rounded-lg bg-sky-100 text-sky-800 border border-sky-300 text-xs font-extrabold';
        card.className = 'bg-white rounded-3xl border-2 border-sky-400 shadow-md p-4 sm:p-5 transition-all';
      }
    }

    /**
     * =========================================================================
     * 5. 原生 SVG viewBox 無損向量縮放（75%~400%）、拖曳平移與鏡頭平滑聚焦
     * =========================================================================
     */
    function getActiveSvg() {
      return document.getElementById(currentMode === 'A' ? 'svg-mode-a' : 'svg-mode-b');
    }

    function getCurrentZoomLevel() {
      const base = BASE_VIEWBOX[currentMode];
      const vb = viewBoxes[currentMode];
      return base.w / vb.w;
    }

    function applySvgViewBox(mode = currentMode) {
      const svg = document.getElementById(mode === 'A' ? 'svg-mode-a' : 'svg-mode-b');
      const vb = viewBoxes[mode];
      if (svg && vb) {
        svg.setAttribute('viewBox', `${vb.x.toFixed(2)} ${vb.y.toFixed(2)} ${vb.w.toFixed(2)} ${vb.h.toFixed(2)}`);
      }
      const badge = document.getElementById('zoom-percent-badge');
      if (badge && mode === currentMode) {
        badge.textContent = `${Math.round(getCurrentZoomLevel() * 100)}%`;
      }
    }

    /**
     * 使用 SVG 螢幕座標逆矩陣 (getScreenCTM().inverse()) 將滑鼠/手指座標精準轉換為 SVG 邏輯座標
     */
    function clientToSvgCoords(svg, clientX, clientY) {
      const pt = svg.createSVGPoint();
      pt.x = clientX;
      pt.y = clientY;
      const ctm = svg.getScreenCTM();
      if (!ctm) {
        const vb = viewBoxes[currentMode];
        return { x: vb.x + vb.w / 2, y: vb.y + vb.h / 2 };
      }
      const svgPt = pt.matrixTransform(ctm.inverse());
      return { x: svgPt.x, y: svgPt.y };
    }

    /**
     * 限制 viewBox 邊界，避免拖曳時整個圖解完全移出畫面外
     */
    function clampViewBox(vb, mode = currentMode) {
      const base = BASE_VIEWBOX[mode];
      const marginX = base.w * 0.45;
      const marginY = base.h * 0.45;
      const minX = -marginX;
      const maxX = base.w + marginX - vb.w;
      const minY = -marginY;
      const maxY = base.h + marginY - vb.h;
      return {
        x: Math.min(Math.max(vb.x, Math.min(minX, maxX)), Math.max(minX, maxX)),
        y: Math.min(Math.max(vb.y, Math.min(minY, maxY)), Math.max(minY, maxY)),
        w: vb.w,
        h: vb.h
      };
    }

    function zoomAtClientPoint(targetZoom, clientX, clientY) {
      if (viewAnimFrameId) {
        cancelAnimationFrame(viewAnimFrameId);
        viewAnimFrameId = null;
      }
      const svg = getActiveSvg();
      if (!svg) return;

      const clampedZoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, targetZoom));
      const base = BASE_VIEWBOX[currentMode];
      const vb = viewBoxes[currentMode];
      const currentZoom = base.w / vb.w;
      if (Math.abs(clampedZoom - currentZoom) < 0.001) return;

      // 取得游標目前指向的 SVG 座標
      const anchor = clientToSvgCoords(svg, clientX, clientY);
      const scaleRatio = currentZoom / clampedZoom;

      const nextW = base.w / clampedZoom;
      const nextH = base.h / clampedZoom;
      const nextX = anchor.x - (anchor.x - vb.x) * scaleRatio;
      const nextY = anchor.y - (anchor.y - vb.y) * scaleRatio;

      viewBoxes[currentMode] = clampViewBox({ x: nextX, y: nextY, w: nextW, h: nextH }, currentMode);
      applySvgViewBox(currentMode);
    }

    function stepZoom(delta) {
      const viewport = document.getElementById('diagram-viewport');
      if (!viewport) return;
      const rect = viewport.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      zoomAtClientPoint(getCurrentZoomLevel() + delta, centerX, centerY);
    }

    /**
     * 使用 requestAnimationFrame 平滑過渡 SVG viewBox 鏡頭
     */
    function animateViewBoxTo(targetVb, duration = 360) {
      if (viewAnimFrameId) {
        cancelAnimationFrame(viewAnimFrameId);
        viewAnimFrameId = null;
      }
      const mode = currentMode;
      const startVb = { ...viewBoxes[mode] };
      const clampedTarget = clampViewBox(targetVb, mode);
      const startTime = performance.now();

      function tick(now) {
        const elapsed = now - startTime;
        const t = Math.min(1, elapsed / duration);
        // 三次方緩出曲線 (easeOutCubic)
        const ease = 1 - Math.pow(1 - t, 3);

        viewBoxes[mode] = {
          x: startVb.x + (clampedTarget.x - startVb.x) * ease,
          y: startVb.y + (clampedTarget.y - startVb.y) * ease,
          w: startVb.w + (clampedTarget.w - startVb.w) * ease,
          h: startVb.h + (clampedTarget.h - startVb.h) * ease
        };
        applySvgViewBox(mode);

        if (t < 1) {
          viewAnimFrameId = requestAnimationFrame(tick);
        } else {
          viewAnimFrameId = null;
        }
      }
      viewAnimFrameId = requestAnimationFrame(tick);
    }

    /**
     * 聚焦放大特定部位（點擊右側「🔍 聚焦放大」按鈕或雙擊圖上部位觸發）
     */
    function focusOnPart(partKey, event) {
      if (event) {
        event.stopPropagation();
      }
      if (currentMode !== 'A') {
        switchMode('A');
      }
      if (selectedPartKey !== partKey) {
        selectPart(partKey, null, true);
      }

      const data = PART_DATA[partKey];
      if (!data || !data.focusBox) return;

      const [bx, by, bw, bh] = data.focusBox;
      const base = BASE_VIEWBOX.A;
      const aspect = base.w / base.h;

      // 根據目標框計算等比例 viewBox，並限制縮放倍率在 1.35x ~ 3.4x 之間
      let targetW = Math.max(bw, bh * aspect);
      const rawZoom = base.w / targetW;
      const clampedZoom = Math.min(3.4, Math.max(1.35, rawZoom));
      targetW = base.w / clampedZoom;
      const targetH = base.h / clampedZoom;

      const centerX = bx + bw / 2;
      const centerY = by + bh / 2;

      animateViewBoxTo({
        x: centerX - targetW / 2,
        y: centerY - targetH / 2,
        w: targetW,
        h: targetH
      });
    }

    function focusOnSelectedPart() {
      const targetKey = selectedPartKey || TAB_CONFIG[activeTab]?.overviewPart || 'battery-holder';
      focusOnPart(targetKey);
    }

    function resetPanZoom() {
      animateViewBoxTo({ ...BASE_VIEWBOX[currentMode] }, 300);
    }

    function resetAllView() {
      resetPanZoom();
      resetSelection();
    }

    function initDiagramPanZoom() {
      const viewport = document.getElementById('diagram-viewport');
      if (!viewport) return;

      // 1. 滑鼠滾輪縮放（以滑鼠游標為中心，75% ~ 400% 原生 SVG 無損縮放）
      viewport.addEventListener(
        'wheel',
        (e) => {
          e.preventDefault();
          const zoomFactor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
          zoomAtClientPoint(getCurrentZoomLevel() * zoomFactor, e.clientX, e.clientY);
        },
        { passive: false }
      );

      // 2. 滑鼠左鍵按住拖曳平移 viewBox
      viewport.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        if (viewAnimFrameId) {
          cancelAnimationFrame(viewAnimFrameId);
          viewAnimFrameId = null;
        }
        const svg = getActiveSvg();
        if (!svg) return;

        isPanning = true;
        hasDragged = false;
        dragStartClientX = e.clientX;
        dragStartClientY = e.clientY;
        dragStartViewBox = { ...viewBoxes[currentMode] };
        const startPt = clientToSvgCoords(svg, e.clientX, e.clientY);
        dragStartSvgX = startPt.x;
        dragStartSvgY = startPt.y;
        viewport.classList.add('is-panning');
      });

      window.addEventListener('mousemove', (e) => {
        if (!isPanning || !dragStartViewBox) return;
        const distPx = Math.hypot(e.clientX - dragStartClientX, e.clientY - dragStartClientY);
        if (distPx > 4) {
          hasDragged = true;
        }
        if (hasDragged) {
          const svg = getActiveSvg();
          if (!svg) return;
          const rect = svg.getBoundingClientRect();
          const dxSvg = ((e.clientX - dragStartClientX) / rect.width) * dragStartViewBox.w;
          const dySvg = ((e.clientY - dragStartClientY) / rect.height) * dragStartViewBox.h;

          viewBoxes[currentMode] = clampViewBox(
            {
              x: dragStartViewBox.x - dxSvg,
              y: dragStartViewBox.y - dySvg,
              w: dragStartViewBox.w,
              h: dragStartViewBox.h
            },
            currentMode
          );
          applySvgViewBox(currentMode);
        }
      });

      window.addEventListener('mouseup', () => {
        if (!isPanning) return;
        isPanning = false;
        dragStartViewBox = null;
        viewport.classList.remove('is-panning');
        setTimeout(() => {
          hasDragged = false;
        }, 40);
      });

      // 3. 平板 / 手機觸控單指拖曳與雙指捏合無損縮放
      viewport.addEventListener(
        'touchstart',
        (e) => {
          if (viewAnimFrameId) {
            cancelAnimationFrame(viewAnimFrameId);
            viewAnimFrameId = null;
          }
          if (e.touches.length === 1) {
            isPanning = true;
            hasDragged = false;
            dragStartClientX = e.touches[0].clientX;
            dragStartClientY = e.touches[0].clientY;
            dragStartViewBox = { ...viewBoxes[currentMode] };
          } else if (e.touches.length === 2) {
            isPanning = false;
            hasDragged = true;
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            initialPinchDist = Math.hypot(dx, dy);
            initialPinchZoom = getCurrentZoomLevel();
          }
        },
        { passive: true }
      );

      viewport.addEventListener(
        'touchmove',
        (e) => {
          if (e.touches.length === 1 && isPanning && dragStartViewBox) {
            const distPx = Math.hypot(e.touches[0].clientX - dragStartClientX, e.touches[0].clientY - dragStartClientY);
            if (distPx > 5) {
              hasDragged = true;
            }
            if (hasDragged) {
              e.preventDefault();
              const svg = getActiveSvg();
              if (!svg) return;
              const rect = svg.getBoundingClientRect();
              const dxSvg = ((e.touches[0].clientX - dragStartClientX) / rect.width) * dragStartViewBox.w;
              const dySvg = ((e.touches[0].clientY - dragStartClientY) / rect.height) * dragStartViewBox.h;

              viewBoxes[currentMode] = clampViewBox(
                {
                  x: dragStartViewBox.x - dxSvg,
                  y: dragStartViewBox.y - dySvg,
                  w: dragStartViewBox.w,
                  h: dragStartViewBox.h
                },
                currentMode
              );
              applySvgViewBox(currentMode);
            }
          } else if (e.touches.length === 2 && initialPinchDist) {
            e.preventDefault();
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            const dist = Math.hypot(dx, dy);
            const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
            const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
            const targetZoom = initialPinchZoom * (dist / initialPinchDist);
            zoomAtClientPoint(targetZoom, midX, midY);
          }
        },
        { passive: false }
      );

      viewport.addEventListener('touchend', () => {
        isPanning = false;
        dragStartViewBox = null;
        initialPinchDist = null;
        setTimeout(() => {
          hasDragged = false;
        }, 40);
      });
    }

    /**
     * =========================================================================
     * 6. 雙模式切換（模式 A：結構探索解說 / 模式 B：通路組裝模擬）
     * =========================================================================
     */
    function switchMode(mode) {
      currentMode = mode;
      const btnA = document.getElementById('btn-mode-a');
      const btnB = document.getElementById('btn-mode-b');
      const svgA = document.getElementById('svg-mode-a');
      const svgB = document.getElementById('svg-mode-b');
      const modeBControls = document.getElementById('mode-b-controls');
      const statusText = document.getElementById('canvas-status-text');

      if (mode === 'A') {
        btnA.className = 'touch-btn flex-1 sm:flex-initial px-4 py-2 rounded-lg text-sm font-bold bg-blue-600 text-white shadow-sm flex items-center justify-center gap-1.5';
        btnB.className = 'touch-btn flex-1 sm:flex-initial px-4 py-2 rounded-lg text-sm font-bold text-slate-600 hover:text-slate-900 flex items-center justify-center gap-1.5';
        svgA.classList.remove('hidden');
        svgB.classList.add('hidden');
        modeBControls.classList.add('hidden');
        statusText.textContent = '提示：滾輪可無損放大至 400%，拖曳可移動，雙擊部位可拉近特寫！';
      } else {
        btnB.className = 'touch-btn flex-1 sm:flex-initial px-4 py-2 rounded-lg text-sm font-bold bg-indigo-600 text-white shadow-sm flex items-center justify-center gap-1.5';
        btnA.className = 'touch-btn flex-1 sm:flex-initial px-4 py-2 rounded-lg text-sm font-bold text-slate-600 hover:text-slate-900 flex items-center justify-center gap-1.5';
        svgA.classList.add('hidden');
        svgB.classList.remove('hidden');
        modeBControls.classList.remove('hidden');
        statusText.textContent = '模擬模式：依序點擊上方 3 個組裝步驟，觀察電流如何形成完整通路！';
        renderAssemblySimulation();
      }
      applySvgViewBox(mode);
    }

    /**
     * 模式 B：切換單一步驟（裝入電池 / 旋入燈泡 / 接上導線）
     */
    function toggleAssemblyStep(step) {
      assemblyState[step] = !assemblyState[step];
      renderAssemblySimulation();
    }

    /**
     * 模式 B：一鍵接通或全部拆開
     */
    function toggleAllAssembly() {
      const allDone = assemblyState.battery && assemblyState.bulb && assemblyState.wires;
      const target = !allDone;
      assemblyState.battery = target;
      assemblyState.bulb = target;
      assemblyState.wires = target;
      renderAssemblySimulation();
    }

    /**
     * 模式 B：根據目前組裝狀態更新 SVG 動畫與電路通電視覺效果
     */
    function renderAssemblySimulation() {
      const { battery, bulb, wires } = assemblyState;

      // 1. 更新步驟按鈕外觀
      updateStepButtonUI('btn-step-battery', battery, '1. 已裝入電池');
      updateStepButtonUI('btn-step-bulb', bulb, '2. 已旋入燈泡');
      updateStepButtonUI('btn-step-wires', wires, '3. 已接上導線');

      const quickBtn = document.getElementById('btn-quick-circuit');
      if (battery && bulb && wires) {
        quickBtn.textContent = '🔄 全部拆開重來';
        quickBtn.className = 'touch-btn px-3.5 py-2 rounded-xl bg-slate-600 hover:bg-slate-700 text-white text-sm font-bold shadow-sm';
      } else {
        quickBtn.textContent = '⚡ 一鍵接通電路';
        quickBtn.className = 'touch-btn px-3.5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold shadow-sm';
      }

      // 2. 電池裝入動畫與彈簧壓縮效果
      const simBatteryMotion = document.getElementById('sim-battery-motion');
      const simSpringCompress = document.getElementById('sim-spring-compress');
      if (battery) {
        simBatteryMotion.style.transform = 'translateY(0px)';
        simSpringCompress.style.transform = 'scaleX(0.68)';
      } else {
        simBatteryMotion.style.transform = 'translateY(-135px)';
        simSpringCompress.style.transform = 'scaleX(1)';
      }

      // 3. 燈泡旋入燈泡座動畫
      const simBulbMotion = document.getElementById('sim-bulb-motion');
      if (bulb) {
        simBulbMotion.style.transform = 'translateY(68px)';
      } else {
        simBulbMotion.style.transform = 'translateY(-78px)';
      }

      // 4. 紅黑導線連接動畫
      const redWire = document.getElementById('sim-red-wire');
      const blackWire = document.getElementById('sim-black-wire');
      redWire.style.strokeDashoffset = wires ? '0' : '260';
      blackWire.style.strokeDashoffset = wires ? '0' : '280';

      // 5. 判斷是否三者皆就位 -> 形成完整通路！點亮燈泡與電流動畫
      const isClosedCircuit = battery && bulb && wires;
      const bulbAura = document.getElementById('sim-bulb-aura');
      const bulbGlassCircle = document.getElementById('sim-bulb-glass-circle');
      const filamentWire = document.getElementById('sim-filament-wire');
      const currentArrows = document.getElementById('sim-current-arrows');
      const bannerBg = document.getElementById('status-banner-bg');
      const bannerText = document.getElementById('status-banner-text');

      if (isClosedCircuit) {
        bulbAura.classList.remove('hidden');
        bulbGlassCircle.setAttribute('fill', '#fef08a');
        bulbGlassCircle.setAttribute('stroke', '#f59e0b');
        filamentWire.setAttribute('stroke', '#ffffff');
        filamentWire.setAttribute('stroke-width', '4');
        currentArrows.classList.remove('hidden');

        bannerBg.setAttribute('fill', '#fef9c3');
        bannerBg.setAttribute('stroke', '#eab308');
        bannerText.setAttribute('fill', '#854d0e');
        bannerText.textContent = '💡 形成完整通路！電流順利流過燈絲，小燈泡發亮了！';

        // 若目前沒有手動選取特定部位，自動在解說卡顯示通路原理
        if (!selectedPartKey) {
          document.getElementById('info-parent-badge').textContent = '通電模擬結果';
          document.getElementById('info-material-badge').textContent = '💡 完整通路（Closed Circuit）';
          document.getElementById('info-title').textContent = '燈泡成功發亮了！';
          document.getElementById('info-icon-box').textContent = '✨';
          document.getElementById('info-description').textContent =
            '電流從電池「正極」出發 ➔ 經平金屬片與紅色導線 ➔ 燈泡座左側接點與底部中央接點 ➔ 燈泡底部灰色接點 ➔ 燈絲（發光！）➔ 螺紋狀金屬體 ➔ 燈泡座螺紋金屬筒與右側接點 ➔ 黑色導線與彈簧 ➔ 回到電池「負極」。';
          document.getElementById('info-tip-text').textContent =
            '試著按一下上方任一步驟按鈕（例如把電池拿出來或拔掉一條導線），觀察電路變成「斷路」時燈泡會發生什麼變化！';
        }
      } else {
        bulbAura.classList.add('hidden');
        bulbGlassCircle.setAttribute('fill', 'url(#bulb-glass-grad)');
        bulbGlassCircle.setAttribute('stroke', '#38bdf8');
        filamentWire.setAttribute('stroke', '#ea580c');
        filamentWire.setAttribute('stroke-width', '2.8');
        currentArrows.classList.add('hidden');

        bannerBg.setAttribute('fill', '#f1f5f9');
        bannerBg.setAttribute('stroke', '#cbd5e1');
        bannerText.setAttribute('fill', '#475569');

        const missing = [];
        if (!battery) missing.push('裝入電池');
        if (!bulb) missing.push('旋入燈泡');
        if (!wires) missing.push('接上導線');
        bannerText.textContent = `🔌 目前為「斷路」（還差：${missing.join('、')}）`;
      }
    }

    function updateStepButtonUI(btnId, isActive, activeLabel) {
      const btn = document.getElementById(btnId);
      const defaultLabels = {
        'btn-step-battery': '1. 裝入電池',
        'btn-step-bulb': '2. 旋入燈泡',
        'btn-step-wires': '3. 接上紅黑導線'
      };
      const icons = {
        'btn-step-battery': isActive ? '✅' : '🔋',
        'btn-step-bulb': isActive ? '✅' : '💡',
        'btn-step-wires': isActive ? '✅' : '🔌'
      };

      btn.innerHTML = `<span>${icons[btnId]}</span><span>${isActive ? activeLabel : defaultLabels[btnId]}</span>`;
      if (isActive) {
        btn.className = 'touch-btn px-3.5 py-2 rounded-xl bg-indigo-600 border-2 border-indigo-600 text-white text-sm font-bold flex items-center gap-1.5 shadow-sm';
      } else {
        btn.className = 'touch-btn px-3.5 py-2 rounded-xl bg-white border-2 border-slate-300 text-slate-700 text-sm font-bold flex items-center gap-1.5 shadow-sm';
      }
    }

    // 頁面載入完成後初始化縮放拖曳功能與預設第一個元件分頁
    window.addEventListener('DOMContentLoaded', () => {
      initDiagramPanZoom();
      switchComponentTab('battery-holder', false);
      updateInfoCard(PART_DATA['battery-holder']);
    });
  </script>
