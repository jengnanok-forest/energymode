    // 切換局部放大鏡（模組一）
    function toggleMagnifier() {
      state.showMagnifier = !state.showMagnifier;
      renderSubModeBar();
    }

    // 渲染畫布頂部子控制列
    function renderSubModeBar() {
      const container = document.getElementById('subModeContainer');
      if (state.activeModule === 1) {
        container.innerHTML = `
          <button onclick=&quot;toggleMagnifier()&quot;
            class=&quot;px-3 py-1.5 rounded-xl text-xs font-bold border transition flex items-center gap-1.5 ${
              state.showMagnifier
                ? 'bg-blue-50 text-blue-700 border-blue-200'
                : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-100'
            }&quot;>
            <span>🔍 局部特寫放大鏡：${state.showMagnifier ? '開啟' : '關閉'}</span>
          </button>
        `;
      } else {
        const isInst = state.subMode2 === 'install';
        container.innerHTML = `
          <div class=&quot;inline-flex rounded-xl bg-slate-200/80 p-1 border border-slate-300/60&quot;>
            <button onclick=&quot;setSubMode2('install')&quot;
              class=&quot;px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 ${
                isInst ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'
              }&quot;>
              <span>▶ 裝入電池動畫（45° 壓彈簧）</span>
            </button>
            <button onclick=&quot;setSubMode2('remove')&quot;
              class=&quot;px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 ${
                !isInst ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'
              }&quot;>
              <span>◀ 取出電池動畫（正極推壓提出）</span>
            </button>
          </div>
        `;
      }
    }

    // 切換「正確標準做法」vs「常見錯誤示範」
    function setErrorMode(isErr) {
      state.isErrorMode = isErr;
      state.outcomeSoundPlayed = false;

      const btnCorrect = document.getElementById('btnModeCorrect');
      const btnError = document.getElementById('btnModeError');
      if (!isErr) {
        btnCorrect.className = 'px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 bg-emerald-600 text-white shadow-sm';
        btnError.className = 'px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 text-slate-600 hover:text-rose-700';
      } else {
        btnCorrect.className = 'px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 text-slate-600 hover:text-emerald-700';
        btnError.className = 'px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 bg-rose-600 text-white shadow-sm';
      }

      // 若當前已接近結尾，自動從該模式關鍵轉折處開始演示，方便師生立刻比較！
      const maxS = getMaxSteps();
      if (state.progress >= maxS - 0.1) {
        state.progress = state.activeModule === 1 ? 2.0 : 1.0;
        state.isPlaying = true;
        updatePlayPauseUI();
      }
      buildStepList();
      syncUIWithProgress(true);
    }

    function togglePlay() {
      const maxS = getMaxSteps();
      if (!state.isPlaying &amp;&amp; state.progress >= maxS - 0.01) {
        state.progress = 0.0;
        state.outcomeSoundPlayed = false;
      }
      state.isPlaying = !state.isPlaying;
      updatePlayPauseUI();
    }

    function replayAnimation() {
      state.progress = 0.0;
      state.isPlaying = true;
      state.lastStepIndex = -1;
      state.outcomeSoundPlayed = false;
      updatePlayPauseUI();
      syncUIWithProgress(true);
    }

    function prevStep() {
      const currentIdx = Math.floor(Math.max(0, state.progress - 0.05));
      const targetStep = Math.max(0, currentIdx - 1);
      state.progress = targetStep;
      state.isPlaying = false;
      state.outcomeSoundPlayed = false;
      updatePlayPauseUI();
      syncUIWithProgress(true);
      sfx.playStepTick();
    }

    function nextStep() {
      const maxS = getMaxSteps();
      const currentIdx = Math.floor(Math.min(maxS - 0.001, state.progress));
      const targetStep = Math.min(maxS - 1, currentIdx + 1);
      state.progress = targetStep;
      state.isPlaying = true; // 點擊下一步自動播放該步驟過程
      state.outcomeSoundPlayed = false;
      updatePlayPauseUI();
      syncUIWithProgress(true);
      sfx.playStepTick();
    }

    function jumpToStep(stepIdx) {
      state.progress = stepIdx;
      state.isPlaying = true;
      state.outcomeSoundPlayed = false;
      updatePlayPauseUI();
      syncUIWithProgress(true);
      sfx.playStepTick();
    }

    function toggleSpeed() {
      state.speed = state.speed === 1.0 ? 0.5 : 1.0;
      document.getElementById('speedText').textContent = state.speed === 1.0 ? '正常 (1.0x)' : '慢動作 (0.5x)';
    }

    function toggleSound() {
      sfx.enabled = !sfx.enabled;
      document.getElementById('iconSoundOn').classList.toggle('hidden', !sfx.enabled);
      document.getElementById('iconSoundOff').classList.toggle('hidden', sfx.enabled);
      if (sfx.enabled) sfx.playStepTick();
    }

    function updatePlayPauseUI() {
      document.getElementById('iconPause').classList.toggle('hidden', !state.isPlaying);
      document.getElementById('iconPlay').classList.toggle('hidden', state.isPlaying);
      document.getElementById('playPauseText').textContent = state.isPlaying ? '暫停' : '播放';
    }

    // 建立時間軸刻度點
    function buildScrubberTicks() {
      const maxS = getMaxSteps();
      scrubber.max = maxS * 100;
      const ticksEl = document.getElementById('scrubberTicks');
      ticksEl.innerHTML = '';
      for (let i = 0; i <= maxS; i++) {
        const dot = document.createElement('span');
        dot.className = 'w-1.5 h-3 rounded-full bg-slate-400/70';
        ticksEl.appendChild(dot);
      }
    }

    // 建立右側步驟清單
    function buildStepList() {
      const data = CURRICULUM_DATA[getCurrentKey()];
      const listEl = document.getElementById('stepListContainer');
      listEl.innerHTML = '';

      data.steps.forEach((step, idx) => {
        const btn = document.createElement('button');
        btn.id = `stepListItem_${idx}`;
        btn.onclick = () => jumpToStep(idx);
        btn.className = 'w-full text-left p-2.5 rounded-xl border transition-all flex items-start gap-2.5 border-slate-200 hover:bg-slate-50';
        btn.innerHTML = `
          <span class=&quot;step-num w-6 h-6 rounded-lg text-xs font-extrabold flex items-center justify-center shrink-0 mt-0.5 bg-slate-100 text-slate-600&quot;>
            ${idx + 1}
          </span>
          <div class=&quot;min-w-0 flex-1&quot;>
            <div class=&quot;text-xs font-bold text-slate-800 truncate&quot;>${step.title.replace(/^步驟 \d+：/, '')}</div>
            <div class=&quot;text-[11px] text-slate-500 line-clamp-1 mt-0.5&quot;>${state.isErrorMode ? step.errorDesc : step.desc}</div>
          </div>
        `;
        listEl.appendChild(btn);
      });
    }

    // 時間軸拖曳事件
    scrubber.addEventListener('input', (e) => {
      state.isPlaying = false;
      state.progress = Number(e.target.value) / 100;
      state.outcomeSoundPlayed = false;
      updatePlayPauseUI();
      syncUIWithProgress(true);
    });

    // 同步時間軸數值與右側教學解說卡片
    function syncUIWithProgress(forceUpdate = false) {
      const maxS = getMaxSteps();
      const stepIdx = Math.min(maxS - 1, Math.floor(state.progress));
      const pct = Math.round((state.progress / maxS) * 100);

      scrubber.value = Math.round(state.progress * 100);
      document.getElementById('scrubberPercentLabel').textContent = `${pct}%`;

      // 觸發結果音效（在最後一步達成結果時）
      if (state.isPlaying &amp;&amp; !state.outcomeSoundPlayed &amp;&amp; state.progress > maxS - 0.35) {
        state.outcomeSoundPlayed = true;
        if (state.isErrorMode) sfx.playError();
        else sfx.playSuccess();
      }

      if (!forceUpdate &amp;&amp; stepIdx === state.lastStepIndex) return;
      state.lastStepIndex = stepIdx;

      const data = CURRICULUM_DATA[getCurrentKey()];
      const step = data.steps[stepIdx];

      document.getElementById('scrubberStepLabel').textContent = `目前進度：${step.title}`;
      document.getElementById('stepBadge').textContent = `步驟 ${stepIdx + 1} / ${maxS}`;
      document.getElementById('stepTitle').textContent = step.title;

      const pill = document.getElementById('modeStatusPill');
      const tipBox = document.getElementById('stepTipBox');
      const tipTitle = document.getElementById('stepTipTitle');

      if (!state.isErrorMode) {
        pill.textContent = '✓ 正確標準操作';
        pill.className = 'px-2.5 py-0.5 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800';
        document.getElementById('stepDescription').textContent = step.desc;
        tipBox.className = 'rounded-xl bg-amber-50 border border-amber-200/80 p-3.5 flex gap-2.5';
        tipTitle.textContent = `💡 ${step.tipTitle}`;
        tipTitle.className = 'text-xs font-bold text-amber-900 mb-0.5';
        document.getElementById('stepTipText').textContent = step.tip;
        document.getElementById('stepTipText').className = 'text-xs text-amber-800 leading-relaxed';
      } else {
        pill.textContent = '⚠ 常見錯誤示範';
        pill.className = 'px-2.5 py-0.5 rounded-full text-xs font-bold bg-rose-100 text-rose-800';
        document.getElementById('stepDescription').textContent = step.errorDesc;
        tipBox.className = 'rounded-xl bg-rose-50 border border-rose-200/80 p-3.5 flex gap-2.5';
        tipTitle.textContent = '⚠️ 錯誤原因與後果分析';
        tipTitle.className = 'text-xs font-bold text-rose-900 mb-0.5';
        document.getElementById('stepTipText').textContent = step.errorTip;
        document.getElementById('stepTipText').className = 'text-xs text-rose-800 leading-relaxed';
      }

      // 高亮步驟清單中的當前項目
      data.steps.forEach((_, idx) => {
        const el = document.getElementById(`stepListItem_${idx}`);
        if (!el) return;
        const numBadge = el.querySelector('.step-num');
        if (idx === stepIdx) {
          el.className = state.isErrorMode
            ? 'w-full text-left p-2.5 rounded-xl border transition-all flex items-start gap-2.5 border-rose-300 bg-rose-50/70 shadow-sm'
            : 'w-full text-left p-2.5 rounded-xl border transition-all flex items-start gap-2.5 border-blue-300 bg-blue-50/70 shadow-sm';
          numBadge.className = state.isErrorMode
            ? 'step-num w-6 h-6 rounded-lg text-xs font-extrabold flex items-center justify-center shrink-0 mt-0.5 bg-rose-600 text-white'
            : 'step-num w-6 h-6 rounded-lg text-xs font-extrabold flex items-center justify-center shrink-0 mt-0.5 bg-blue-600 text-white';
        } else {
          el.className = 'w-full text-left p-2.5 rounded-xl border transition-all flex items-start gap-2.5 border-slate-200 hover:bg-slate-50';
          numBadge.className = 'step-num w-6 h-6 rounded-lg text-xs font-extrabold flex items-center justify-center shrink-0 mt-0.5 bg-slate-100 text-slate-600';
        }
      });
    }

    /**
     * ============================================================================
     * 8. 主動畫迴圈（requestAnimationFrame 平滑更新）
     * ============================================================================
     */
    function animateLoop(timestamp) {
      if (!state.lastTimestamp) state.lastTimestamp = timestamp;
      const dt = Math.min(0.05, (timestamp - state.lastTimestamp) / 1000);
      state.lastTimestamp = timestamp;

      const maxS = getMaxSteps();

      if (state.isPlaying) {
        // 每個步驟約需 1.85 秒（1.0x 速度下），節奏從容清晰適合教學觀察
        const stepRate = (1 / 1.85) * state.speed;
        state.progress += dt * stepRate;

        if (state.progress >= maxS) {
          state.progress = maxS;
          state.isPlaying = false;
          updatePlayPauseUI();
        }
        syncUIWithProgress(false);
      }

      // 取得 CSS 邏輯寬高並繪製對應模組畫面
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const viewW = canvas.width / dpr;
      const viewH = canvas.height / dpr;

      ctx.clearRect(0, 0, viewW, viewH);

      if (state.activeModule === 1) {
        renderModule1(ctx, viewW, viewH);
      } else {
        renderModule2(ctx, viewW, viewH);
      }

      requestAnimationFrame(animateLoop);
    }

    // 支援畫布上直接左右拖曳進行時間軸微調（Scrubbing）
    let isCanvasDragging = false;
    let dragStartX = 0;
    let dragStartProgress = 0;

    canvas.addEventListener('pointerdown', (e) => {
      isCanvasDragging = true;
      dragStartX = e.clientX;
      dragStartProgress = state.progress;
      canvas.setPointerCapture(e.pointerId);
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!isCanvasDragging) return;
      const dx = e.clientX - dragStartX;
      if (Math.abs(dx) > 4) {
        state.isPlaying = false;
        updatePlayPauseUI();
        const maxS = getMaxSteps();
        const deltaProgress = (dx / 450) * maxS;
        state.progress = clamp(dragStartProgress + deltaProgress, 0, maxS);
        syncUIWithProgress(true);
      }
    });

    canvas.addEventListener('pointerup', (e) => {
      isCanvasDragging = false;
      canvas.releasePointerCapture(e.pointerId);
    });

    // 鍵盤左右方向鍵快捷控制
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        togglePlay();
      } else if (e.code === 'ArrowRight') {
        nextStep();
      } else if (e.code === 'ArrowLeft') {
        prevStep();
      }
    });

    // 啟動應用程式
    window.onload = function () {
      resizeCanvas();
      switchModule(1);
      requestAnimationFrame(animateLoop);
    };
  </script>

    /**
     * =========================================================================
     * 2. 應用程式狀態管理（右側分頁狀態與原生 SVG viewBox 縮放平移狀態）
     * =========================================================================
     */
    let currentMode = 'A'; // 'A' = 結構探索解說, 'B' = 通路組裝模擬
    let activeTab = 'battery-holder';
    let selectedPartKey = null;

    // 模式 B 組裝狀態
    const assemblyState = {
      battery: false,
      bulb: false,
      wires: false
    };

    /**
     * =========================================================================
     * 3. 右側四大元件分頁切換與動態按鈕渲染
     * =========================================================================
     */
    function switchComponentTab(tabKey, autoSelectOverview = true) {
      const tab = TAB_CONFIG[tabKey];
      if (!tab) return;
      activeTab = tabKey;

      // 1. 更新頂部 4 個分頁按鈕外觀
      document.querySelectorAll('[data-tab-btn]').forEach((btn) => {
        const key = btn.getAttribute('data-tab-btn');
        const cfg = TAB_CONFIG[key];
        if (key === tabKey) {
          btn.className = `touch-btn px-2 py-2.5 rounded-2xl text-xs sm:text-sm font-extrabold flex flex-col sm:flex-row items-center justify-center gap-1 transition-all ${cfg.accentBg} text-white shadow-sm`;
          btn.setAttribute('aria-selected', 'true');
        } else {
          btn.className = 'touch-btn px-2 py-2.5 rounded-2xl text-xs sm:text-sm font-extrabold flex flex-col sm:flex-row items-center justify-center gap-1 transition-all text-slate-600 hover:bg-white/80 hover:text-slate-900';
          btn.setAttribute('aria-selected', 'false');
        }
      });

      // 2. 渲染當前分頁的「查看整體構造」與「細部構造 2 欄網格」
      const panelBody = document.getElementById('tab-panel-body');
      const subButtonsHtml = tab.subParts
        .map((sp) => {
          let badgeClass = 'bg-amber-100 text-amber-800';
          if (sp.badgeType === 'insulator') {
            badgeClass = 'bg-emerald-50 text-emerald-700 border border-emerald-200/80';
          } else if (sp.badgeType === 'mixed') {
            badgeClass = 'bg-indigo-50 text-indigo-700 border border-indigo-200/80';
          } else {
            badgeClass = 'bg-amber-50 text-amber-800 border border-amber-200/80';
          }

          return `
            <button
              type="button"
              data-part-btn="${sp.key}"
              onclick="selectPart('${sp.key}')"
              class="part-item-btn touch-btn px-3 py-2.5 rounded-2xl bg-white border border-slate-200 hover:border-amber-300 text-slate-700 text-sm font-bold text-left flex items-center justify-between gap-1.5 shadow-2xs"
            >
              <span class="truncate">${sp.name}</span>
              <span class="text-[11px] px-1.5 py-0.5 rounded-md font-extrabold shrink-0 ${badgeClass}">${sp.badge}</span>
            </button>
          `;
        })
        .join('');

      panelBody.innerHTML = `
        <div class="flex items-center justify-between gap-2 mb-3">
          <div class="flex items-center gap-2">
            <span class="text-lg">${tab.icon}</span>
            <div>
              <h3 class="text-base font-black text-slate-800 leading-tight">${tab.label}構造列表</h3>
              <p class="text-xs text-slate-500 font-medium">${tab.subtitle}</p>
            </div>
          </div>
          <span class="text-[11px] text-slate-400 font-semibold">點擊放大部位</span>
        </div>

        <!-- 查看整體構造按鈕 -->
        <button
          type="button"
          data-part-btn="${tab.overviewPart}"
          onclick="selectPart('${tab.overviewPart}')"
          class="touch-btn w-full mb-3 px-4 py-2.5 rounded-2xl ${tab.softBg} border ${tab.softBorder} hover:brightness-98 text-slate-800 text-sm font-extrabold flex items-center justify-between shadow-2xs"
        >
          <span class="flex items-center gap-2">
            <span class="w-6 h-6 rounded-lg ${tab.accentBg} text-white text-xs flex items-center justify-center">${tab.icon}</span>
            <span>${tab.overviewTitle}</span>
          </span>
          <span class="text-xs px-2 py-0.5 rounded-full bg-white/90 text-slate-600 border border-slate-200 font-bold">整組聚焦</span>
        </button>

        <!-- 細部構造 2 欄按鈕網格 -->
        <div class="grid grid-cols-2 gap-2">
          ${subButtonsHtml}
        </div>
      `;

      // 3. 若需要自動選取整體構造，則同步高亮左側圖示與更新解說卡片
      if (autoSelectOverview) {
        selectPart(tab.overviewPart, null, true);
      } else if (selectedPartKey) {
        syncPartButtonHighlight(selectedPartKey);
      }
    }

    /**
     * 同步右側分頁內按鈕的選取高亮狀態
     */
    function syncPartButtonHighlight(partKey) {
      document.querySelectorAll('[data-part-btn]').forEach((btn) => {
        if (btn.getAttribute('data-part-btn') === partKey) {
          btn.classList.add('ring-2', 'ring-amber-500', 'bg-amber-50', 'border-amber-400', 'scale-[1.02]');
        } else {
          btn.classList.remove('ring-2', 'ring-amber-500', 'bg-amber-50', 'border-amber-400', 'scale-[1.02]');
        }
      });
    }

    /**
     * =========================================================================
     * 4. 點選結構名稱／圖示部位：雙向同步分頁、局部放大與更新解說卡片
     * =========================================================================
     */
    function handleBgClick(event) {
      resetSelection();
    }

    function selectPart(partKey, event, forceSelect = false) {
      if (event) {
        event.stopPropagation();
      }
      // 若剛完成拖曳操作，忽略點擊事件避免誤觸

      const data = PART_DATA[partKey];
      if (!data) return;

      // 若重複點擊同一個已選取部位（且非切換分頁強制觸發），恢復該元件整體狀態
      if (!forceSelect && selectedPartKey === partKey) {
        resetSelection();
        return;
      }

      // 若點選的部位屬於不同分頁，自動切換右側分頁至該元件分頁
      if (data.tab && data.tab !== activeTab) {
        switchComponentTab(data.tab, false);
      }

      selectedPartKey = partKey;

      // 1. 清除先前的 SVG 選取狀態
      clearAllHighlightClasses();

      // 2. 啟動畫布聚光燈模式（未選取部位變淡）
      const svgA = document.getElementById('svg-mode-a');
      const svgB = document.getElementById('svg-mode-b');
      svgA.classList.add('canvas-has-selection');
      svgB.classList.add('canvas-has-selection');

      // 3. 針對對應的 SVG 部位加上 is-selected（觸發彈性放大與純向量發光外框）
      data.svgIds.forEach((id) => {
        const el = document.getElementById(id);
        if (el) {
          el.classList.add('is-selected');
          const parentGroup = el.closest('.svg-mainpart');
          if (parentGroup && parentGroup !== el) {
            parentGroup.style.opacity = '1';
            parentGroup.style.filter = 'none';
          }
        }
      });

      // 4. 高亮並放大對應的圖上引線標籤
      data.calloutIds.forEach((cid) => {
        const cel = document.getElementById(cid);
        if (cel) {
          cel.classList.add('is-selected');
        }
      });

      // 5. 高亮右側當前分頁中對應的結構按鈕
      syncPartButtonHighlight(partKey);

      // 6. 更新頂部已選取提示徽章
      const badge = document.getElementById('selected-badge');
      badge.textContent = `已選取：${data.title}`;
      badge.classList.remove('hidden');

      // 7. 更新即時結構解說卡片內容
      updateInfoCard(data);
    }

    /**
     * 清除所有放大與高亮樣式，恢復原始比例
     */
    function resetSelection() {
      selectedPartKey = null;
      clearAllHighlightClasses();

      const svgA = document.getElementById('svg-mode-a');
      const svgB = document.getElementById('svg-mode-b');
      svgA.classList.remove('canvas-has-selection');
      svgB.classList.remove('canvas-has-selection');

      const badge = document.getElementById('selected-badge');
      badge.classList.add('hidden');

      // 恢復當前分頁的整體構造說明
      const currentTabCfg = TAB_CONFIG[activeTab];
      if (currentTabCfg && PART_DATA[currentTabCfg.overviewPart]) {
        updateInfoCard(PART_DATA[currentTabCfg.overviewPart]);
      }
    }

    /**
     * 輔助函式：移除所有元素上的選取與內聯樣式覆蓋
     */
    function clearAllHighlightClasses() {
      document.querySelectorAll('.svg-part').forEach((el) => {
        el.classList.remove('is-selected');
        el.style.opacity = '';
        el.style.filter = '';
      });
      document.querySelectorAll('.callout-group').forEach((el) => {
        el.classList.remove('is-selected');
      });
      document.querySelectorAll('[data-part-btn]').forEach((btn) => {
        btn.classList.remove('ring-2', 'ring-amber-500', 'bg-amber-50', 'border-amber-400', 'scale-[1.02]');
      });
    }

    /**
     * 更新右側即時結構解說卡片
     */
    function updateInfoCard(data) {
      document.getElementById('info-parent-badge').textContent = data.parent;
      document.getElementById('info-title').textContent = data.title;
      document.getElementById('info-icon-box').textContent = data.icon;
      document.getElementById('info-description').textContent = data.desc;
      document.getElementById('info-tip-text').textContent = data.tip;

      const matBadge = document.getElementById('info-material-badge');
      const card = document.getElementById('info-card');
      matBadge.textContent = data.materialLabel;

      if (data.materialType === 'conductor') {
        matBadge.className = 'px-2.5 py-0.5 rounded-lg bg-amber-100 text-amber-800 border border-amber-300 text-xs font-extrabold';
        card.className = 'bg-white rounded-3xl border-2 border-amber-400 shadow-md p-4 sm:p-5 transition-all';
      } else if (data.materialType === 'insulator') {
        matBadge.className = 'px-2.5 py-0.5 rounded-lg bg-emerald-100 text-emerald-800 border border-emerald-300 text-xs font-extrabold';
        card.className = 'bg-white rounded-3xl border-2 border-emerald-400 shadow-md p-4 sm:p-5 transition-all';
      } else {
        matBadge.className = 'px-2.5 py-0.5 rounded-lg bg-sky-100 text-sky-800 border border-sky-300 text-xs font-extrabold';
        card.className = 'bg-white rounded-3xl border-2 border-sky-400 shadow-md p-4 sm:p-5 transition-all';
      }
    }

    function resetAllView() {
      resetSelection();
    }

    /**
     * =========================================================================
     * 6. 雙模式切換（模式 A：結構探索解說 / 模式 B：通路組裝模擬）
     * =========================================================================
     */
    function loadTechniqueFrame() {
      const frame = document.getElementById('technique-frame');
      if (frame.dataset.loaded) return;
      frame.dataset.loaded = '1';
      frame.addEventListener('load', () => {
        try {
          const doc = frame.contentDocument;
          const fit = () => {
            frame.style.height = doc.documentElement.scrollHeight + 'px';
          };
          fit();
          new ResizeObserver(fit).observe(doc.body);
        } catch (err) {
          /* 若無法存取內容則維持預設高度 */
        }
      });
      frame.srcdoc = frame.dataset.srcdoc;
    }

    function switchMode(mode) {
      const btnA = document.getElementById('btn-mode-a');
      const btnB = document.getElementById('btn-mode-b');
      const btnC = document.getElementById('btn-mode-c');
      const mainEl = document.getElementById('main-explorer');
      const techEl = document.getElementById('main-technique');
      const resetBtn = document.getElementById('btn-reset-view');
      const inactive = 'touch-btn flex-1 sm:flex-initial px-4 py-2 rounded-lg text-sm font-bold text-slate-600 hover:text-slate-900 flex items-center justify-center gap-1.5';

      if (mode === 'C') {
        currentMode = 'C';
        btnA.className = inactive;
        btnB.className = inactive;
        btnC.className = 'touch-btn flex-1 sm:flex-initial px-4 py-2 rounded-lg text-sm font-bold bg-emerald-600 text-white shadow-sm flex items-center justify-center gap-1.5';
        mainEl.classList.add('hidden');
        techEl.classList.remove('hidden');
        resetBtn.classList.add('hidden');
        loadTechniqueFrame();
        return;
      }

      btnC.className = inactive;
      techEl.classList.add('hidden');
      mainEl.classList.remove('hidden');
      resetBtn.classList.remove('hidden');
      switchModeAB(mode);
    }

    function switchModeAB(mode) {
      currentMode = mode;
      const btnA = document.getElementById('btn-mode-a');
      const btnB = document.getElementById('btn-mode-b');
      const svgA = document.getElementById('svg-mode-a');
      const svgB = document.getElementById('svg-mode-b');
      const modeBControls = document.getElementById('mode-b-controls');
      const statusText = document.getElementById('canvas-status-text');

      if (mode === 'A') {
        btnA.className = 'touch-btn flex-1 sm:flex-initial px-4 py-2 rounded-lg text-sm font-bold bg-blue-600 text-white shadow-sm flex items-center justify-center gap-1.5';
        btnB.className = 'touch-btn flex-1 sm:flex-initial px-4 py-2 rounded-lg text-sm font-bold text-slate-600 hover:text-slate-900 flex items-center justify-center gap-1.5';
        svgA.classList.remove('hidden');
        svgB.classList.add('hidden');
        modeBControls.classList.add('hidden');
        statusText.textContent = '提示：點擊圖上部位或標籤，可查看該構造的說明；要放大畫面請使用瀏覽器縮放。';
      } else {
        btnB.className = 'touch-btn flex-1 sm:flex-initial px-4 py-2 rounded-lg text-sm font-bold bg-indigo-600 text-white shadow-sm flex items-center justify-center gap-1.5';
        btnA.className = 'touch-btn flex-1 sm:flex-initial px-4 py-2 rounded-lg text-sm font-bold text-slate-600 hover:text-slate-900 flex items-center justify-center gap-1.5';
        svgA.classList.add('hidden');
        svgB.classList.remove('hidden');
        modeBControls.classList.remove('hidden');
        statusText.textContent = '模擬模式：依序點擊上方 3 個組裝步驟，觀察電流如何形成完整通路！';
        renderAssemblySimulation();
      }
    }

    /**
     * 模式 B：切換單一步驟（裝入電池 / 旋入燈泡 / 接上導線）
     */
    function toggleAssemblyStep(step) {
      assemblyState[step] = !assemblyState[step];
      renderAssemblySimulation();
    }

    /**
     * 模式 B：一鍵接通或全部拆開
     */
    function toggleAllAssembly() {
      const allDone = assemblyState.battery && assemblyState.bulb && assemblyState.wires;
      const target = !allDone;
      assemblyState.battery = target;
      assemblyState.bulb = target;
      assemblyState.wires = target;
      renderAssemblySimulation();
    }

    /**
     * 模式 B：根據目前組裝狀態更新 SVG 動畫與電路通電視覺效果
     */
    function renderAssemblySimulation() {
      const { battery, bulb, wires } = assemblyState;

      // 1. 更新步驟按鈕外觀
      updateStepButtonUI('btn-step-battery', battery, '1. 已裝入電池');
      updateStepButtonUI('btn-step-bulb', bulb, '2. 已旋入燈泡');
      updateStepButtonUI('btn-step-wires', wires, '3. 已接上導線');

      const quickBtn = document.getElementById('btn-quick-circuit');
      if (battery && bulb && wires) {
        quickBtn.textContent = '🔄 全部拆開重來';
        quickBtn.className = 'touch-btn px-3.5 py-2 rounded-xl bg-slate-600 hover:bg-slate-700 text-white text-sm font-bold shadow-sm';
      } else {
        quickBtn.textContent = '⚡ 一鍵接通電路';
        quickBtn.className = 'touch-btn px-3.5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold shadow-sm';
      }

      // 2. 電池裝入動畫與彈簧壓縮效果
      const simBatteryMotion = document.getElementById('sim-battery-motion');
      const simSpringCompress = document.getElementById('sim-spring-compress');
      if (battery) {
        simBatteryMotion.style.transform = 'translateY(0px)';
        simSpringCompress.style.transform = 'scaleX(0.68)';
      } else {
        simBatteryMotion.style.transform = 'translateY(-135px)';
        simSpringCompress.style.transform = 'scaleX(1)';
      }

      // 3. 燈泡旋入燈泡座動畫
      const simBulbMotion = document.getElementById('sim-bulb-motion');
      if (bulb) {
        simBulbMotion.style.transform = 'translateY(68px)';
      } else {
        simBulbMotion.style.transform = 'translateY(-78px)';
      }

      // 4. 紅黑導線連接動畫
      const redWire = document.getElementById('sim-red-wire');
      const blackWire = document.getElementById('sim-black-wire');
      redWire.style.strokeDashoffset = wires ? '0' : '1000';
      blackWire.style.strokeDashoffset = wires ? '0' : '1000';
      const bareStyle = (id) => {
        const el = document.getElementById(id);
        if (!el) return;
        el.style.transitionDelay = wires ? '0.5s' : '0s';
        el.style.opacity = wires ? '1' : '0';
      };
      bareStyle('sim-red-bare');
      bareStyle('sim-black-bare');

      // 5. 判斷是否三者皆就位 -> 形成完整通路！點亮燈泡與電流動畫
      const isClosedCircuit = battery && bulb && wires;
      const bulbAura = document.getElementById('sim-bulb-aura');
      const bulbGlassCircle = document.getElementById('sim-bulb-glass-circle');
      const filamentWire = document.getElementById('sim-filament-wire');
      const currentArrows = document.getElementById('sim-current-arrows');
      const bannerBg = document.getElementById('status-banner-bg');
      const bannerText = document.getElementById('status-banner-text');

      if (isClosedCircuit) {
        bulbAura.classList.remove('hidden');
        bulbGlassCircle.setAttribute('fill', '#fef08a');
        bulbGlassCircle.setAttribute('stroke', '#f59e0b');
        filamentWire.setAttribute('stroke', '#ffffff');
        filamentWire.setAttribute('stroke-width', '4');
        currentArrows.classList.remove('hidden');

        bannerBg.setAttribute('fill', '#fef9c3');
        bannerBg.setAttribute('stroke', '#eab308');
        bannerText.setAttribute('fill', '#854d0e');
        bannerText.textContent = '💡 形成完整通路！電流順利流過燈絲，小燈泡發亮了！';

        // 若目前沒有手動選取特定部位，自動在解說卡顯示通路原理
        if (!selectedPartKey) {
          document.getElementById('info-parent-badge').textContent = '通電模擬結果';
          document.getElementById('info-material-badge').textContent = '💡 完整通路（Closed Circuit）';
          document.getElementById('info-title').textContent = '燈泡成功發亮了！';
          document.getElementById('info-icon-box').textContent = '✨';
          document.getElementById('info-description').textContent =
            '電流從電池「正極」出發 ➔ 經平金屬片與紅色導線 ➔ 燈泡座左側接點與底部中央接點 ➔ 燈泡底部灰色接點 ➔ 燈絲（發光！）➔ 螺紋狀金屬體 ➔ 燈泡座螺紋金屬筒與右側接點 ➔ 黑色導線與彈簧 ➔ 回到電池「負極」。';
          document.getElementById('info-tip-text').textContent =
            '試著按一下上方任一步驟按鈕（例如把電池拿出來或拔掉一條導線），觀察電路變成「斷路」時燈泡會發生什麼變化！';
        }
      } else {
        bulbAura.classList.add('hidden');
        bulbGlassCircle.setAttribute('fill', 'url(#bulb-glass-grad-b)');
        bulbGlassCircle.setAttribute('stroke', '#38bdf8');
        filamentWire.setAttribute('stroke', '#ea580c');
        filamentWire.setAttribute('stroke-width', '2.8');
        currentArrows.classList.add('hidden');

        bannerBg.setAttribute('fill', '#f1f5f9');
        bannerBg.setAttribute('stroke', '#cbd5e1');
        bannerText.setAttribute('fill', '#475569');

        const missing = [];
        if (!battery) missing.push('裝入電池');
        if (!bulb) missing.push('旋入燈泡');
        if (!wires) missing.push('接上導線');
        bannerText.textContent = `🔌 目前為「斷路」（還差：${missing.join('、')}）`;
      }
    }

    function updateStepButtonUI(btnId, isActive, activeLabel) {
      const btn = document.getElementById(btnId);
      const defaultLabels = {
        'btn-step-battery': '1. 裝入電池',
        'btn-step-bulb': '2. 旋入燈泡',
        'btn-step-wires': '3. 接上紅黑導線'
      };
      const icons = {
        'btn-step-battery': isActive ? '✅' : '🔋',
        'btn-step-bulb': isActive ? '✅' : '💡',
        'btn-step-wires': isActive ? '✅' : '🔌'
      };

      btn.innerHTML = `<span>${icons[btnId]}</span><span>${isActive ? activeLabel : defaultLabels[btnId]}</span>`;
      if (isActive) {
        btn.className = 'touch-btn px-3.5 py-2 rounded-xl bg-indigo-600 border-2 border-indigo-600 text-white text-sm font-bold flex items-center gap-1.5 shadow-sm';
      } else {
        btn.className = 'touch-btn px-3.5 py-2 rounded-xl bg-white border-2 border-slate-300 text-slate-700 text-sm font-bold flex items-center gap-1.5 shadow-sm';
      }
    }

    // 頁面載入完成後初始化縮放拖曳功能與預設第一個元件分頁
    window.addEventListener('DOMContentLoaded', () => {
      switchComponentTab('battery-holder', false);
      updateInfoCard(PART_DATA['battery-holder']);
    });
  </script>
</body>
